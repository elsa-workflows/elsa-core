name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Elsa.Templates.slnx

      - name: Build
        run: dotnet build Elsa.Templates.slnx --no-restore

      - name: Test
        run: dotnet test test/Elsa.Templates.Tests/Elsa.Templates.Tests.csproj --no-build
