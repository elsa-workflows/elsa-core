name: Elsa.Slack release-unit artifact rehearsal

# This workflow creates local CI artifacts only. Feed publication requires a
# separate, explicitly approved cutover change.
on:
  pull_request:
    paths:
      - '.github/workflows/release-elsa-slack.yml'
      - 'src/extensions/communication/Elsa.Slack/**'
      - 'src/extensions/Directory.Build.*'
      - 'src/extensions/Directory.Packages.props'
      - 'src/modules/**'
      - 'src/common/**'
      - 'src/Fody.props'
      - 'src/Directory.Build.*'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'doc/integration-program/release-units.json'
      - 'scripts/integration-program/prove_slack_artifact_consumer.py'
      - 'scripts/integration-program/verify_slack_source_link.py'
      - 'scripts/integration-program/run_mapped_slack_package_proof.py'
      - 'scripts/integration-program/run_slack_package_proof.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elsa-slack-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-slack-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Read the reviewed Elsa package baseline
        id: dependency
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          manifest = json.load(open('doc/integration-program/release-units.json', encoding='utf-8'))
          units = [unit for unit in manifest['release_units'] if unit['package_id'] == 'Elsa.Slack']
          if len(units) != 1:
              raise SystemExit(f'Expected one Elsa.Slack release unit, got {len(units)}')
          dependencies = {item['package_id']: item['version']
                          for item in units[0]['tested_artifact_dependencies']}
          if set(dependencies) != {'Elsa', 'SlackNet'}:
              raise SystemExit(f'Unexpected tested dependencies: {dependencies}')
          print(f"elsa_version={dependencies['Elsa']}")
          print(f"slacknet_version={dependencies['SlackNet']}")
          print(f"proof_base_version={units[0]['versioning']['local_proof_version']}")
          PY
      - name: Pack only Elsa.Slack with a proof version
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          ELSA_VERSION: ${{ steps.dependency.outputs.elsa_version }}
          SLACKNET_VERSION: ${{ steps.dependency.outputs.slacknet_version }}
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/slack-artifacts"
          cat > "$RUNNER_TEMP/Slack-NuGet.Config" <<'EOF'
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet restore src/extensions/communication/Elsa.Slack/Elsa.Slack.csproj \
            --configfile "$RUNNER_TEMP/Slack-NuGet.Config" \
            -p:UseProjectReferences=false \
            -p:ElsaVersion="$ELSA_VERSION"
          dotnet pack src/extensions/communication/Elsa.Slack/Elsa.Slack.csproj \
            --configuration Release \
            --no-restore \
            --output "$RUNNER_TEMP/slack-artifacts" \
            -p:IsPackable=true \
            -p:UseProjectReferences=false \
            -p:ElsaVersion="$ELSA_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:PackageProjectUrl=https://github.com/elsa-workflows/elsa-core \
            -p:RepositoryUrl=https://github.com/elsa-workflows/elsa-core \
            -p:ContinuousIntegrationBuild=true
          python3 - "$RUNNER_TEMP/slack-artifacts" "$PACKAGE_VERSION" "$ELSA_VERSION" "$SLACKNET_VERSION" "$EXPECTED_SOURCE_SHA" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          directory, version, elsa_version, slacknet_version, source_sha = (
              Path(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          )
          expected = f"Elsa.Slack.{version}"
          actual = sorted(path.name for path in directory.iterdir() if path.is_file())
          if actual != [f"{expected}.nupkg", f"{expected}.snupkg"]:
              raise SystemExit(f"Expected only Elsa.Slack artifacts, got {actual}")
          frameworks = ("net8.0", "net9.0", "net10.0")
          with ZipFile(directory / f"{expected}.nupkg") as package:
              names = [name for name in package.namelist() if name.endswith(".nuspec")]
              if len(names) != 1:
                  raise SystemExit(f"Expected one nuspec, got {names}")
              root = ET.fromstring(package.read(names[0]))
              namespace = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
              package_id = root.findtext("n:metadata/n:id", namespaces=namespace)
              package_version = root.findtext("n:metadata/n:version", namespaces=namespace)
              if (package_id, package_version) != ("Elsa.Slack", version):
                  raise SystemExit(f"Unexpected nuspec identity: {package_id} {package_version}")
              project_url = root.findtext("n:metadata/n:projectUrl", namespaces=namespace)
              repository = root.find("n:metadata/n:repository", namespaces=namespace)
              url = "https://github.com/elsa-workflows/elsa-core"
              if (project_url != url or repository is None or repository.get("url") != url
                      or repository.get("commit") != source_sha):
                  raise SystemExit(f"Unexpected source URLs: {project_url}, {repository}")
              for framework in frameworks:
                  if f"lib/{framework}/Elsa.Slack.dll" not in package.namelist():
                      raise SystemExit(f"Missing {framework} assembly")
              groups = root.findall("n:metadata/n:dependencies/n:group", namespace)
              if {group.get("targetFramework") for group in groups} != set(frameworks):
                  raise SystemExit(f"Unexpected dependency frameworks: {groups}")
              for group in groups:
                  dependencies = {item.get("id"): item.get("version")
                                  for item in group.findall("n:dependency", namespace)}
                  if dependencies != {"Elsa": elsa_version, "SlackNet": slacknet_version}:
                      raise SystemExit(f"Unexpected package dependencies: {dependencies}")
          with ZipFile(directory / f"{expected}.snupkg") as symbols:
              for framework in frameworks:
                  if f"lib/{framework}/Elsa.Slack.pdb" not in symbols.namelist():
                      raise SystemExit(f"Missing {framework} symbols")
          print(f"Verified artifact-only Elsa.Slack {version} at {directory}")
          PY
      - name: Restore and run a clean package consumer
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          ELSA_VERSION: ${{ steps.dependency.outputs.elsa_version }}
          SLACKNET_VERSION: ${{ steps.dependency.outputs.slacknet_version }}
        run: |
          python3 scripts/integration-program/prove_slack_artifact_consumer.py \
            --artifacts "$RUNNER_TEMP/slack-artifacts" \
            --version "$PACKAGE_VERSION" \
            --elsa-version "$ELSA_VERSION" \
            --slacknet-version "$SLACKNET_VERSION"
      - name: Verify SourceLink against the exact Core commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/sourcelink" sourcelink \
            --version 3.1.1 --configfile "$RUNNER_TEMP/Slack-NuGet.Config"
          python3 scripts/integration-program/verify_slack_source_link.py \
            --artifacts "$RUNNER_TEMP/slack-artifacts" \
            --version "$PACKAGE_VERSION" \
            --commit "$EXPECTED_SOURCE_SHA" \
            --sourcelink-tool "$RUNNER_TEMP/sourcelink/sourcelink" \
            --output "$RUNNER_TEMP/slack-source-link-receipt.json"
      - name: Defer Core SourceLink verification for fork commits
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo '::notice::Fork commit is not yet in elsa-core; rerun SourceLink verification from the imported repository before release acceptance.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-local-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-artifacts/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: elsa-slack-source-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-source-link-receipt.json
          if-no-files-found: error
          retention-days: 7
