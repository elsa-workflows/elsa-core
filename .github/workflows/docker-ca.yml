name: Docker certificate smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'scripts/test-ca-trust.sh'
      - 'scripts/validate_studio_dockerfile.py'
      - 'scripts/test_validate_studio_dockerfile.py'
      - 'core/test/TlsSmoke/**'
      - '.github/workflows/docker-ca.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'scripts/test-ca-trust.sh'
      - 'scripts/validate_studio_dockerfile.py'
      - 'scripts/test_validate_studio_dockerfile.py'
      - 'core/test/TlsSmoke/**'
      - '.github/workflows/docker-ca.yml'

jobs:
  validate-studio-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reject a Studio image that builds or runs the server
        run: |
          python3 -B scripts/validate_studio_dockerfile.py
          python3 -B -m unittest discover -s scripts -p 'test_validate_studio_dockerfile.py'
          python3 -B -O -m unittest discover -s scripts -p 'test_validate_studio_dockerfile.py'

  smoke:
    needs: validate-studio-dockerfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elsa-server
            dockerfile: docker/ElsaServer.Dockerfile
            image: elsa-server-smoke
            skip_otel: '0'
          - name: elsa-server-and-studio
            dockerfile: docker/ElsaServerAndStudio.Dockerfile
            image: elsa-server-and-studio-smoke
            skip_otel: '0'
          - name: elsa-studio
            dockerfile: docker/ElsaStudio.Dockerfile
            image: elsa-studio-smoke
            skip_otel: '0'
          - name: elsa-server-datadog
            dockerfile: docker/ElsaServer-Datadog.Dockerfile
            image: elsa-server-datadog-smoke
            skip_otel: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish TLS smoke test app
        run: dotnet publish core/test/TlsSmoke/TlsSmoke.csproj -c Release -o artifacts/tls-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: Require the Studio image command to be the Studio host
        if: matrix.name == 'elsa-studio'
        run: |
          set -euo pipefail
          cmd="$(docker inspect -f '{{json .Config.Cmd}}' "${{ matrix.image }}")"
          echo "$cmd"
          test "$cmd" = '["dotnet","Elsa.Studio.Host.Server.dll"]'
          case "$cmd" in
            *ModularServer*|*Elsa.Server.Web*|*ServerAndStudio*) exit 1 ;;
          esac

      - name: Run TLS smoke tests
        env:
          SKIP_OTEL: ${{ matrix.skip_otel }}
        run: |
          set -euo pipefail
          TLS_APP_DIR="${{ github.workspace }}/artifacts/tls-smoke"
          if [ "$SKIP_OTEL" = "1" ]; then
            scripts/test-ca-trust.sh "${{ matrix.image }}" "$TLS_APP_DIR" -e ELSA_SKIP_OTEL_AUTO=1
          else
            scripts/test-ca-trust.sh "${{ matrix.image }}" "$TLS_APP_DIR"
          fi
