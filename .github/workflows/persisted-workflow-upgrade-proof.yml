name: Persisted workflow upgrade proof

on:
  push:
    branches:
      - 'codex/**'
      - 'main'
    paths:
      - '.github/workflows/persisted-workflow-upgrade-proof.yml'
      - 'scripts/integration-program/run_persisted_workflow_upgrade_fixture.py'
      - 'scripts/integration-program/test_persisted_workflow_upgrade_fixture.py'
      - 'scripts/integration-program/persisted-workflow-upgrade/**'
      - 'scripts/integration-program/prove_consolidated_package_consumers.py'
  workflow_dispatch:

permissions: {}

jobs:
  retrieve:
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      input-artifact-id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      # Repository-write push/manual authority is the trust boundary. This job
      # never checks out or executes repository code with the artifact token.
      - name: Retrieve original verified unpublished artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upgrade-input"
          gh api repos/elsa-workflows/elsa-core/actions/artifacts/11390805430 > "$RUNNER_TEMP/upgrade-input/artifact.json"
          gh api repos/elsa-workflows/elsa-core/actions/artifacts/11390805430/zip > "$RUNNER_TEMP/upgrade-input/proof.zip"
          jq -e '
            .id == 11390805430 and
            .name == "consolidated-proof-37410240989-1" and
            .expired == false and
            .workflow_run.id == 37410240989 and
            .workflow_run.head_sha == "44083dc4f47d56aa2d5c215b0c7479c0b7290cb0"
          ' "$RUNNER_TEMP/upgrade-input/artifact.json" > /dev/null
          printf '%s  %s\n' \
            '8317e5766591f9da2d1f83cd6a85274bd41efbfbd0039d6a1bcfaf0c9bf81636' \
            "$RUNNER_TEMP/upgrade-input/proof.zip" | sha256sum --check --status
      - name: Transfer only the verified original inputs
        id: transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persisted-upgrade-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/upgrade-input/proof.zip
            ${{ runner.temp }}/upgrade-input/artifact.json
          if-no-files-found: error
          retention-days: 1

  proof:
    needs: retrieve
    permissions:
      contents: read
      actions: none
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.retrieve.outputs.input-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/upgrade-input
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Validate and extract original inputs without an artifact-reading token
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integration-program/run_persisted_workflow_upgrade_fixture.py \
            --extract-only --artifact-metadata "$RUNNER_TEMP/upgrade-input/artifact.json" \
            --proof-archive "$RUNNER_TEMP/upgrade-input/proof.zip" \
            --proof-artifacts "$RUNNER_TEMP/verified-proof"
      - name: Verify tooling contracts
        working-directory: scripts/integration-program
        run: python3 -m unittest test_persisted_workflow_upgrade_fixture.py
      - name: Execute all six real package upgrade cells
        run: >-
          python3 scripts/integration-program/run_persisted_workflow_upgrade_fixture.py
          --proof-artifacts "$RUNNER_TEMP/verified-proof"
          --proof-archive "$RUNNER_TEMP/upgrade-input/proof.zip"
          --output "$RUNNER_TEMP/persisted-upgrade-proof"
      - name: Retain allowlisted synthetic databases and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persisted-upgrade-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persisted-upgrade-proof/retained-evidence
          if-no-files-found: warn
          retention-days: 7
