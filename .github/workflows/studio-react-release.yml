# Release-owned preparation for #8857/#8858. Publication is inert until the
# release program enables REACT_STUDIO_PUBLISH_ENABLED and protects the
# react-studio-release environment with Release reviewers and tag restrictions.
name: React Studio Preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep version (3.11.0-preview.N first, then 3.11.0)
        required: true
        type: string
      publish:
        description: Publish the approved matching release tag (requires Release cutover)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: react-studio-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.selection.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and publication authority
        id: selection
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_ENABLED: ${{ vars.REACT_STUDIO_PUBLISH_ENABLED }}
        run: python3 studio/react/scripts/validate-release-selection.py
      - name: Require the publication tag to be merged into main
        if: inputs.publish
        run: git merge-base --is-ancestor HEAD origin/main

  image:
    needs: [prepare, npm-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.publish && 'react-studio-release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub after Release approval
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build the exact Preview image with provenance and SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: studio/react/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          outputs: ${{ !inputs.publish && format('type=oci,dest={0}/react-studio-preview.tar', runner.temp) || '' }}
          tags: elsaworkflows/elsa-react-studio:${{ needs.prepare.outputs.version }}
          build-args: ELSA_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Retain the prepared image without publishing
        if: '!inputs.publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-studio-image-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/react-studio-preview.tar
          if-no-files-found: error
          retention-days: 7

  npm-build:
    name: Prepare and install the exact npm release artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Build and prepare public tarballs without changing workspace manifests
        working-directory: studio/react
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/prepare-npm-release.mjs "$VERSION" "$RUNNER_TEMP/react-studio-npm"
          node scripts/test-npm-release.mjs "$RUNNER_TEMP/react-studio-npm"
          pnpm test:packages --npm-feed "$RUNNER_TEMP/react-studio-npm"
      - name: Preflight registry versions and npm publication without publishing
        if: inputs.publish || contains(inputs.version, '-preview.')
        working-directory: studio/react
        run: node scripts/publish-npm-release.mjs "$RUNNER_TEMP/react-studio-npm" --dry-run
      - name: Pack matching NuGet libraries and verify installation in the generated module
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet pack Elsa.ReactStudio.slnf -c Release -p:Version="$VERSION" --output "$RUNNER_TEMP/react-studio-nuget"
          python3 studio/react/scripts/verify-nuget-packages.py "$RUNNER_TEMP/react-studio-nuget" "$VERSION"
          cd studio/react
          pnpm exec playwright install --with-deps chromium
          pnpm test:module --nuget-feed "$RUNNER_TEMP/react-studio-nuget" --studio-version "$VERSION" --npm-feed "$RUNNER_TEMP/react-studio-npm"
      - name: Verify source manifests and lockfile remained unchanged
        run: git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-studio-npm-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/react-studio-npm/*
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    name: Release publishes the verified tarballs with npm provenance
    if: inputs.publish
    needs: [prepare, npm-build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: react-studio-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # No registry-url/token injection: npm uses its GitHub OIDC trusted publisher.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: react-studio-npm-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/react-studio-npm
      - name: Check trusted-publishing support and publish with provenance
        env:
          REACT_STUDIO_PUBLISH_ENABLED: ${{ vars.REACT_STUDIO_PUBLISH_ENABLED }}
        run: |
          node -e 'const [major, minor, patch] = require("node:child_process").execFileSync("npm", ["--version"], {encoding:"utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("Trusted publishing requires npm >= 11.5.1");'
          node studio/react/scripts/publish-npm-release.mjs "$RUNNER_TEMP/react-studio-npm"
