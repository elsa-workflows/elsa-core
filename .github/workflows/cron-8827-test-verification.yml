name: Elsa #8827 null cron regression tests

on:
  push:
    branches:
      - fix/8827-null-cron-expression-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Run full Scheduling unit test suite with coverage gate
        run: dotnet test core/test/unit/Elsa.Scheduling.UnitTests/Elsa.Scheduling.UnitTests.csproj --verbosity quiet
