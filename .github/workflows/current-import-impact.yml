name: Current imported-source test impact

on:
  pull_request:
    paths:
      # The selector must rerun for any source, test, or imported helper change.
      - '.github/**'
      - 'build/**'
      - 'scripts/integration-program/**'
      - 'samples/**'
      - 'src/**'
      - 'test/**'
      - 'doc/integration-program/release-units.json'
      # These inputs can change the restored project/TFM graph without changing
      # the package source paths below.
      - '**/*.sln'
      - '**/*.slnx'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.rsp'
      - '**/NuGet.Config'
      - '**/nuget.config'
      - '**/packages.lock.json'
      - '**/global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test selection policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p 'test_current_import_impact.py'
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p 'test_current_import_impact.py'
      - name: Restore and select from this exact source revision
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/integration-program/current_import_impact.py \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/current-import-impact.json"
      - name: Upload nonpublishing selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-import-impact
          path: ${{ runner.temp }}/current-import-impact.json
          if-no-files-found: warn
          retention-days: 14
