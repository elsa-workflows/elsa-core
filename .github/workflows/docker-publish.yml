# Publishes the Elsa 3 Community Docker images (source-built reference hosts).
#
# Images (Docker Hub only; these are the names the old Community publishers used,
# and the names still referenced by the root README, wiki, samples, and docs):
#   elsaworkflows/elsa-server-v3              <- docker/ElsaServer.Dockerfile
#   elsaworkflows/elsa-studio-v3              <- docker/ElsaStudio.Dockerfile
#   elsaworkflows/elsa-server-and-studio-v3   <- docker/ElsaServerAndStudio.Dockerfile
#
# Tags:
#   every accepted version publishes its exact X.Y.Z or X.Y.Z-preview.N tag
#   stable X.Y.Z also moves X.Y when it is the highest stable X.Y.* tag
#   stable X.Y.Z also moves latest when it is the highest stable 3.x tag
#   previews never move X.Y or latest
#
# Registry login uses the Community publisher secrets last used by
# .github/workflows/elsa-server.yml (and the studio / combined siblings):
#   DOCKER_USER, DOCKER_PASS
# The inert Apps publisher uses different names (DOCKER_USERNAME / DOCKER_PASSWORD)
# and is out of scope here.
#
# Datadog (docker/ElsaServer-Datadog.Dockerfile) is smoke-tested by docker-ca.yml
# but was never a published Community image, so it is not included.
#
# Multi-arch: linux/amd64,linux/arm64. The retired Community workflows also
# pushed linux/arm/v7; that platform is dropped because current .NET 10 base
# images and the later Apps publisher are amd64/arm64 only.
#
# Do not dispatch this workflow to the public registry without the owner's GO.

name: Publish Elsa 3 Community Docker images

on:
  push:
    tags:
      # GitHub tag filters are globs, not regex. The prepare job rejects
      # anything that is not 3.X.Y or 3.X.Y-preview.N (no v prefix).
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Elsa 3 SemVer tag to build and publish (for example 3.9.0 or 3.9.0-preview.1)
        required: true
        type: string

permissions:
  contents: read

# One group for every version and trigger. The highest-tag decision in
# prepare and the floating X.Y / latest pushes must not overlap.
concurrency:
  group: docker-publish-floating-tags
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version and source
    if: github.repository == 'elsa-workflows/elsa-core'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      move_latest: ${{ steps.release.outputs.move_latest }}
      move_minor: ${{ steps.release.outputs.move_minor }}
    steps:
      - name: Validate version, require the matching git tag, and choose floating tags
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version || '' }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="$TAG_NAME"
          fi
          SOURCE_REF="$VERSION"

          if [[ "$VERSION" == v* ]]; then
            echo "elsa-core release tags have no v prefix (received '$VERSION')." >&2
            exit 1
          fi

          STABLE_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          PREVIEW_RE='^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$'

          if [[ "$VERSION" =~ $STABLE_RE ]]; then
            STABLE=true
          elif [[ "$VERSION" =~ $PREVIEW_RE ]]; then
            STABLE=false
          else
            echo "Unsupported version '$VERSION'. Use 3.X.Y or 3.X.Y-preview.N." >&2
            exit 1
          fi

          case "$VERSION" in
            3.*)
              ;;
            *)
              echo "This workflow publishes Elsa 3 Community images only (received '$VERSION')." >&2
              exit 1
              ;;
          esac

          REMOTE="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --tags "$REMOTE" "refs/tags/${VERSION}" >/dev/null; then
            echo "Git tag '$VERSION' does not exist on $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          MOVE_LATEST=false
          MOVE_MINOR=false
          if [ "$STABLE" = true ]; then
            STABLE_TAGS=$(
              git ls-remote --tags "$REMOTE" \
                | awk '$2 ~ /^refs\/tags\/3\.[0-9]+\.[0-9]+$/ { sub(/^refs\/tags\//, "", $2); print $2 }' \
                | sort -u
            )
            STABLE_TAGS=$(printf '%s\n%s\n' "$STABLE_TAGS" "$VERSION" | awk 'NF' | sort -u)
            HIGHEST=$(printf '%s\n' "$STABLE_TAGS" | sort -V | tail -n1)
            MINOR="${VERSION%.*}"
            HIGHEST_LINE=$(printf '%s\n' "$STABLE_TAGS" | grep -E "^${MINOR}\\.[0-9]+$" | sort -V | tail -n1)

            if [ "$VERSION" = "$HIGHEST" ]; then
              MOVE_LATEST=true
            fi
            if [ "$VERSION" = "$HIGHEST_LINE" ]; then
              MOVE_MINOR=true
            fi

            echo "Stable 3.x tags considered:"
            printf '%s\n' "$STABLE_TAGS" | sort -V
            echo "Highest 3.x=$HIGHEST highest ${MINOR}.=$HIGHEST_LINE"
          fi

          {
            echo "version=$VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "move_latest=$MOVE_LATEST"
            echo "move_minor=$MOVE_MINOR"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing Community images as $VERSION from tag $SOURCE_REF (move_minor=$MOVE_MINOR move_latest=$MOVE_LATEST)"

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elsa-server
            dockerfile: docker/ElsaServer.Dockerfile
            image: elsaworkflows/elsa-server-v3
          - name: elsa-server-and-studio
            dockerfile: docker/ElsaServerAndStudio.Dockerfile
            image: elsaworkflows/elsa-server-and-studio-v3
    steps:
      - name: Checkout ${{ needs.prepare.outputs.source_ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.move_minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.move_latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/elsa-workflows/elsa-core
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.source_ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
