name: Execution-cycle ownership proof

on:
  pull_request:
    paths:
      - 'src/modules/Elsa.Workflows.Core/**'
      - 'src/modules/Elsa.Workflows.Runtime/**'
      - 'src/modules/Elsa.Alterations/**'
      - 'test/unit/Elsa.Workflows.Core.UnitTests/**'
      - 'test/unit/Elsa.Workflows.Runtime.UnitTests/**'
      - 'test/integration/Elsa.Workflows.IntegrationTests/**'
      - 'test/integration/Elsa.Alterations.IntegrationTests/**'
      - 'scripts/integration-program/run_execution_cycle_proof.py'
      - 'scripts/integration-program/test_execution_cycle_proof.py'
      - '.github/workflows/execution-cycle-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: execution-cycle-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-cycle-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Check evidence policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p test_execution_cycle_proof.py
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p test_execution_cycle_proof.py
      - name: Build supported frameworks and verify execution ownership serially
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/integration-program/run_execution_cycle_proof.py \
            --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/execution-cycle-proof"
      - name: Retain sanitized case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-cycle-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/execution-cycle-proof/receipt.json
          if-no-files-found: error
          retention-days: 14
