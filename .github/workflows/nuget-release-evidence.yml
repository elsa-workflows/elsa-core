name: NuGet release evidence
on:
  # Release tags can be on an older maintenance branch. Run the evidence tooling
  # from trusted main. The release-triggered Packages rebuild can fail or be
  # cancelled independently after the approved candidate is already on both feeds.
  workflow_run:
    workflows: [Packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version to verify against its reviewed candidate pin
        type: string
        required: true

permissions: {}

jobs:
  select:
    if: >-
      github.repository == 'elsa-workflows/elsa-core' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/packages.yml'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
    outputs:
      version: ${{ steps.admit.outputs.version }}
      source: ${{ steps.admit.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the existing stable release tag and pinned product source
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]] && ! jq -e --arg v "$VERSION" 'has($v)' .github/release-pins/consolidated.json >/dev/null; then
            echo "Release $VERSION has no consolidated candidate pin." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$VERSION" =~ ^3\.(10|11)\.(0|[1-9][0-9]*)$ ]]
          python3 scripts/verify_consolidated_candidate.py validate-pin --version "$VERSION"
          source=$(jq -er --arg version "$VERSION" '.[$version].source_sha' .github/release-pins/consolidated.json)
          test -z "$EVENT_SOURCE" || test "$source" = "$EVENT_SOURCE"
          test "$source" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$VERSION" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" | jq -e --arg version "$VERSION" '.tag_name == $version and (.draft or .prerelease | not)' >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

  evidence:
    needs: select
    if: needs.select.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.select.outputs.version }}
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Retrieve the reviewed candidate without publisher credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_consolidated_candidate.py retrieve --version "$VERSION" --output "$RUNNER_TEMP/transport"
      - name: Reverify the immutable candidate and read the released packages anonymously
        run: python3 scripts/nuget_release_evidence.py assemble --version "$VERSION" --transport "$RUNNER_TEMP/transport" --output "$RUNNER_TEMP/evidence"
      - name: Verify the candidate producer's attestation before accepting the readback
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/evidence"
          unzip -p nuget-sboms.zip nuget-candidate-index.json > "$RUNNER_TEMP/nuget-candidate-index.json"
          gh attestation verify "$RUNNER_TEMP/nuget-candidate-index.json" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/prepare-consolidated-release-candidate.yml" \
            --source-ref refs/heads/main --source-digest "$(jq -er .tooling_commit nuget-release-index.json)" --deny-self-hosted-runners
          echo "digest=sha256:$(sha256sum nuget-release-index.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: nuget-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: nuget-release-index.json
          subject-digest: ${{ needs.evidence.outputs.digest }}
          create-storage-record: false

  attach:
    needs: [select, evidence, attest]
    runs-on: ubuntu-24.04
    concurrency:
      group: nuget-release-evidence-${{ needs.select.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.evidence.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/evidence
      - name: Attach only missing matching release assets and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.select.outputs.version }}
          SOURCE: ${{ needs.select.outputs.source }}
          INDEX_DIGEST: ${{ needs.evidence.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/evidence"
          test "${INDEX_DIGEST#sha256:}" = "$(sha256sum nuget-release-index.json | cut -d ' ' -f 1)"
          test "$(jq -er .sbom_bundle.sha256 nuget-release-index.json)" = "$(sha256sum nuget-sboms.zip | cut -d ' ' -f 1)"
          test "$SOURCE" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$VERSION" --jq .sha)"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          jq -e --arg version "$VERSION" '.tag_name == $version and (.draft or .prerelease | not)' <<< "$release" >/dev/null
          missing=()
          placeholders=()
          for name in nuget-sboms.zip nuget-release-index.json; do
            asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<< "$release")
            if [[ -z "$asset" ]]; then
              missing+=("$name")
            elif jq -e '.state == "starter" and .size == 0' <<< "$asset" >/dev/null; then
              placeholders+=("$(jq -er .id <<< "$asset")/$name")
              missing+=("$name")
            else
              gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output - | cmp - "$name"
            fi
          done
          for placeholder in "${placeholders[@]}"; do
            endpoint="repos/$GITHUB_REPOSITORY/releases/assets/${placeholder%%/*}"
            gh api "$endpoint" | jq -e --arg name "${placeholder#*/}" '.name == $name and .state == "starter" and .size == 0' >/dev/null
            gh api --method DELETE "$endpoint"
          done
          if (( ${#missing[@]} )); then
            gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" "${missing[@]}"
          fi
          for name in nuget-sboms.zip nuget-release-index.json; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name" | cmp - "$name"
          done

  consumer:
    needs: [select, attach]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.select.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify anonymously downloaded release assets and both public feeds on a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for name in nuget-sboms.zip nuget-release-index.json; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name" -o "$name"
          done
          sample=$(python3 "$GITHUB_WORKSPACE/scripts/nuget_release_evidence.py" sample --version "$VERSION" --index-file nuget-release-index.json)
          identifier=$(jq -er .id <<< "$sample")
          framework=$(jq -er .framework <<< "$sample")
          lower=${identifier,,}
          for feed in feedz nuget; do
            case "$feed" in
              feedz) base=https://f.feedz.io/elsa-workflows/elsa-3/nuget/v3/packages ;;
              nuget) base=https://api.nuget.org/v3-flatcontainer ;;
            esac
            url="$base/$lower/$VERSION/$lower.$VERSION.nupkg"
            curl --fail --silent --show-error --location --retry 3 "$url" -o sample.nupkg
            python3 "$GITHUB_WORKSPACE/scripts/nuget_release_evidence.py" verify --version "$VERSION" --identifier "$identifier" \
              --framework "$framework" --feed "$feed" --package sample.nupkg --index-file nuget-release-index.json --bundle nuget-sboms.zip
          done
