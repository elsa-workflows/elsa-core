name: Package impact closure rehearsal

on:
  pull_request:
    paths:
      - 'scripts/integration-program/package_impact.py'
      - 'scripts/integration-program/package_closure.py'
      - 'scripts/integration-program/refresh_canonical_dependency_graph.py'
      - 'scripts/integration-program/release_unit_manifest.py'
      - 'scripts/integration-program/run_slack_package_proof.py'
      - 'scripts/integration-program/run_mapped_slack_package_proof.py'
      - 'scripts/integration-program/verify_mapped_slack_consumer_provenance.py'
      - 'scripts/integration-program/VerifyEmbeddedSources/**'
      - 'scripts/integration-program/test_*.py'
      - 'scripts/integration-program/consolidated-build/source-integration.patch'
      - 'doc/integration-program/inventory/inventory.json'
      - 'doc/integration-program/release-units.json'
      - 'doc/integration-program/package-closure.md'
      - 'doc/integration-program/consolidation/canonical-95a-impact-closure.json'
      - 'doc/integration-program/slack-package-proof.md'
      - 'doc/integration-program/consolidation/build-preparation.md'
      - 'doc/integration-program/consolidation/mapped-slack-package-proof.md'
      - '.github/workflows/package-impact-closure.yml'
  workflow_dispatch:
    inputs:
      include_docker:
        description: Run the two Testcontainers-backed component projects
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: package-impact-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selector-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test selector and closure classification
        run: |
          python -m unittest discover -s scripts/integration-program -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_*.py'
      - name: Rehearse the Core-to-Slack dependency selection
        run: >-
          python scripts/integration-program/package_closure.py
          --inventory doc/integration-program/inventory/inventory.json
          --output "${RUNNER_TEMP}/package-closure-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-closure-plan
          path: ${{ runner.temp }}/package-closure-plan.json

  pinned-source-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read source pins from the inventory
        id: pins
        run: >-
          python scripts/integration-program/package_closure.py
          --inventory doc/integration-program/inventory/inventory.json
          --github-output "$GITHUB_OUTPUT"
          --output "${RUNNER_TEMP}/source-pins-plan.json"
      - name: Checkout pinned Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.pins.outputs.core }}
          path: sources/elsa-core
          persist-credentials: false
      - name: Checkout pinned Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.pins.outputs.extensions }}
          path: sources/elsa-extensions
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Execute the pinned dependency closure
        run: |
          args=()
          if [ "${{ inputs.include_docker }}" = "true" ]; then
            args+=(--include-docker)
          fi
          python scripts/integration-program/package_closure.py \
            --inventory doc/integration-program/inventory/inventory.json \
            --source elsa-core=sources/elsa-core \
            --source elsa-extensions=sources/elsa-extensions \
            --run "${args[@]}" \
            --output "${RUNNER_TEMP}/package-closure.json"
      - name: Upload source, TRX, and build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-closure-source-test-receipts
          path: |
            ${{ runner.temp }}/source-pins-plan.json
            ${{ runner.temp }}/package-closure.json
            ${{ runner.temp }}/artifacts/**
          if-no-files-found: warn

  released-artifact-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assert the runner targets the released 3.8.4 source pins
        id: release-pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          sys.path.insert(0, "scripts/integration-program")
          import run_slack_package_proof as proof

          expected = {
              "core": "33181ae3048f628f591a0155b5665a8e4d1bcea2",
              "extensions": "154ba15fb4da85b4bebecfbe43639579cbda1d0d",
          }
          actual = {"core": proof.CORE_SHA, "extensions": proof.EXTENSIONS_SHA}
          for name, pin in expected.items():
              if not re.fullmatch(r"[0-9a-f]{40}", pin) or actual[name] != pin:
                  raise SystemExit(f"Proof runner {name} pin {actual[name]!r} differs from released 3.8.4 pin {pin!r}")
              print(f"{name}={pin}")
          PY
      - name: Checkout released Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.release-pins.outputs.core }}
          path: sources/elsa-core
          persist-credentials: false
      - name: Checkout released Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.release-pins.outputs.extensions }}
          path: sources/elsa-extensions
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install isolated SourceLink 3.1.1 tool
        run: |
          tool_root="${RUNNER_TEMP}/sourcelink"
          mkdir -p "$tool_root"
          cat > "$tool_root/NuGet.Config" <<'EOF'
          <configuration><packageSources><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          EOF
          dotnet tool install --tool-path "$tool_root" sourcelink --version 3.1.1 --configfile "$tool_root/NuGet.Config"
      - name: Run local-only released artifact and clean consumer proof
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/run_slack_package_proof.py \
            --core-source sources/elsa-core \
            --extensions-source sources/elsa-extensions \
            --output-dir "$PROOF_OUTPUT" \
            --sourcelink-tool "${RUNNER_TEMP}/sourcelink/sourcelink"
      - name: Upload proof receipts, logs, and generated consumer inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-released-artifact-proof-evidence
          path: |
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/impact-selection.json
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/logs/**
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/test-results/**/*.trx
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.cs
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.csproj
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/NuGet.Config
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/source-link/*.pdb
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/NuGet.Config
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/Source-NuGet.Config
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the local released-source proof package only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-local-proof-nupkg
          path: ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/local-feed/Elsa.Slack.3.8.5-proof.154ba15.nupkg
          if-no-files-found: warn
          retention-days: 14

  mapped-source-artifact-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the pinned integration source commits
        id: source-pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          sys.path.insert(0, "scripts/integration-program")
          import run_mapped_slack_package_proof as proof

          for name, commit in proof.SOURCE_COMMITS.items():
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"Invalid {name} source commit: {commit!r}")
              print(f"{name}={commit}")
          print(f"package_id={proof.PACKAGE_ID}")
          print(f"package_version={proof.PACKAGE_VERSION}")
          PY
      - name: Checkout pinned Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.source-pins.outputs.core }}
          path: sources/elsa-core
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.source-pins.outputs.extensions }}
          path: sources/elsa-extensions
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-studio
          ref: ${{ steps.source-pins.outputs.studio }}
          path: sources/elsa-studio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Prepare a disposable history-mapped Slack source tree
        env:
          REHEARSAL: ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/rehearse-import.py \
            --core sources/elsa-core \
            --extensions sources/elsa-extensions \
            --studio sources/elsa-studio \
            --output "$REHEARSAL"
          git -C "$REHEARSAL" -c advice.detachedHead=false switch --quiet --detach rehearsal
          git -C "$REHEARSAL" reset --hard --quiet HEAD
          python scripts/integration-program/prepare_consolidated_build.py --rehearsal "$REHEARSAL"
      - name: Pack and verify mapped Slack locally
        env:
          REHEARSAL: ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/run_mapped_slack_package_proof.py \
            --rehearsal "$REHEARSAL" \
            --core-source sources/elsa-core \
            --extensions-source sources/elsa-extensions \
            --studio-source sources/elsa-studio \
            --output-dir "$PROOF_OUTPUT"
      - name: Recheck exact local package provenance from retained consumer outputs
        if: success()
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
          RECHECK_RECEIPT: ${{ runner.temp }}/elsa-slack-consumer-provenance-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python scripts/integration-program/verify_mapped_slack_consumer_provenance.py \
            --evidence "$PROOF_OUTPUT/evidence.json" \
            --output "$RECHECK_RECEIPT"
      - name: Bundle portable mapped Slack provenance inputs
        if: success()
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
          PORTABLE_BUNDLE: ${{ runner.temp }}/elsa-slack-portable-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
        run: |
          python scripts/integration-program/create_mapped_slack_portable_bundle.py \
            --evidence "$PROOF_OUTPUT/evidence.json" \
            --output "$PORTABLE_BUNDLE"
      - name: Upload portable mapped Slack provenance bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-mapped-portable-provenance
          path: ${{ runner.temp }}/elsa-slack-portable-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Upload mapped-source proof receipts, logs, and consumer inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-mapped-source-proof-evidence
          path: |
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/current-source-impact-selection.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/logs/**
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/test-results/**/*.trx
            ${{ runner.temp }}/elsa-slack-consumer-provenance-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.cs
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.csproj
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/NuGet.Config
            ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}/import-receipt.json
            ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}/consolidated-build-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the local mapped-source package only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-mapped-local-proof-nupkg
          path: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/local-feed/${{ steps.source-pins.outputs.package_id }}.${{ steps.source-pins.outputs.package_version }}.nupkg
          if-no-files-found: warn
          retention-days: 14
