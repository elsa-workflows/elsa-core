name: Integration program tools

on:
  pull_request:
    paths:
      - 'scripts/integration-program/**'
      - '.github/workflows/integration-program-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-rehearsal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify import safety and history preservation
        run: |
          python -m unittest discover -s scripts/integration-program -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_*.py'
