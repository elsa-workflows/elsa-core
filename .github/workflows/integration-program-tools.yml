name: Integration program tools

on:
  pull_request:
    paths:
      - 'scripts/integration-program/**'
      - 'doc/integration-program/verify-hierarchy.py'
      - 'doc/integration-program/hierarchy.json'
      - '.github/workflows/integration-program-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-rehearsal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The bridge verifies an older pinned Core commit with git cat-file and git diff.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify program graph, import safety and history preservation
        run: |
          python doc/integration-program/verify-hierarchy.py
          python -m unittest discover -s scripts/integration-program -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_*.py'
      - name: Verify activity contract comparison guards
        run: |
          python -m unittest discover -s scripts/integration-program/activity-compatibility -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program/activity-compatibility -p 'test_*.py'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # The pinned lockfiles include SDK-resolved ILLink tooling; keep the SDK stable.
          dotnet-version: '10.0.300'
      - name: Verify synthetic Secrets SQLite bridge against current Core
        run: |
          python scripts/integration-program/run_secrets_sqlite_bridge_contract.py \
            --report-out "$RUNNER_TEMP/secrets-sqlite-bridge-report.json"
      - name: Characterize published Secrets PostgreSQL upgrade and rollback
        run: |
          python scripts/integration-program/run_secrets_postgresql_upgrade_fixture.py \
            --report-out "$RUNNER_TEMP/secrets-postgresql-upgrade-report.json"
          diff -u scripts/integration-program/secrets-postgresql-upgrade/observed-result.json \
            "$RUNNER_TEMP/secrets-postgresql-upgrade-report.json"
      - name: Prove synthetic PostgreSQL Secrets fresh-destination bridge
        run: |
          python scripts/integration-program/run_secrets_postgresql_bridge.py \
            --report-out "$RUNNER_TEMP/secrets-postgresql-bridge-report.json"
      - name: Retain redacted PostgreSQL bridge report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-postgresql-bridge-report
          path: ${{ runner.temp }}/secrets-postgresql-bridge-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Characterize published Secrets SQL Server upgrade failure
        run: |
          python scripts/integration-program/run_secrets_sqlserver_upgrade_fixture.py \
            --report-out "$RUNNER_TEMP/secrets-sqlserver-upgrade-report.json"
          diff -u scripts/integration-program/secrets-sqlserver-upgrade/observed-result.json \
            "$RUNNER_TEMP/secrets-sqlserver-upgrade-report.json"
