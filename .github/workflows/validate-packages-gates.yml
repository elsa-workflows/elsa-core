name: Validate package publication gates

on:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/validate-packages-gates.yml'
      - 'scripts/validate_packages_*.py'
      - 'scripts/test_validate_packages_*.py'
      - '.github/workflows/prepare-consolidated-release-candidate.yml'
      - 'scripts/integration-program/prepare_consolidated_release_candidate.py'
      - 'scripts/integration-program/test_prepare_consolidated_release_candidate.py'
      - 'scripts/integration-program/consolidated-candidate-inventory-baseline.json'
      - 'scripts/integration-program/prove_consolidated*.py'
      - 'scripts/integration-program/test_prove_consolidated*.py'
      - 'scripts/integration-program/consolidated-package-consumer/**'
      - 'build/Build.cs'
      - 'build/ConsolidatedPackageProof.targets'
      - 'extensions/src/Directory.Build.*'
      - 'studio/src/Directory.Build.*'
      - '.agents/skills/elsa-release/references/consolidated-feedz-profile.json'
      - '.agents/skills/elsa-release/references/elsa-profile.json'
      - '.agents/skills/elsa-release/references/runbook.md'
      - '.agents/skills/elsa-release/scripts/release_train.py'
      - '.agents/skills/elsa-release/tests/test_release_train.py'
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/validate-packages-gates.yml'
      - 'scripts/validate_packages_*.py'
      - 'scripts/test_validate_packages_*.py'
      - '.github/workflows/prepare-consolidated-release-candidate.yml'
      - 'scripts/integration-program/prepare_consolidated_release_candidate.py'
      - 'scripts/integration-program/test_prepare_consolidated_release_candidate.py'
      - 'scripts/integration-program/consolidated-candidate-inventory-baseline.json'
      - 'scripts/integration-program/prove_consolidated*.py'
      - 'scripts/integration-program/test_prove_consolidated*.py'
      - 'scripts/integration-program/consolidated-package-consumer/**'
      - 'build/Build.cs'
      - 'build/ConsolidatedPackageProof.targets'
      - 'extensions/src/Directory.Build.*'
      - 'studio/src/Directory.Build.*'
      - '.agents/skills/elsa-release/references/consolidated-feedz-profile.json'
      - '.agents/skills/elsa-release/references/elsa-profile.json'
      - '.agents/skills/elsa-release/references/runbook.md'
      - '.agents/skills/elsa-release/scripts/release_train.py'
      - '.agents/skills/elsa-release/tests/test_release_train.py'

permissions:
  contents: read

jobs:
  validate-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned workflow parser
        # PyYAML 6.0.3, CPython 3.12 manylinux x86_64 wheel.
        run: |
          echo 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/gate-requirements.txt"
          python3 -m pip install --only-binary :all: --require-hashes -r "$RUNNER_TEMP/gate-requirements.txt"
      - run: python3 -B scripts/validate_packages_workflow_gates.py
      - name: Test the gate validator and the dispatch selection check
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_validate_packages_*.py'
          python3 -B -O -m unittest discover -s scripts -p 'test_validate_packages_*.py'
      - name: Test isolated candidate preparation and original archive contracts
        run: |
          python3 -B -m unittest discover -s scripts/integration-program -p 'test_prepare_consolidated_release_candidate.py'
          python3 -B -O -m unittest discover -s scripts/integration-program -p 'test_prepare_consolidated_release_candidate.py'
          python3 -B -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
          python3 -B -O -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
      - name: Verify maintenance release train and candidate-only rejection
        run: |
          python3 -B -m unittest discover -s .agents/skills/elsa-release/tests -p 'test_release_train.py'
          python3 -B -O -m unittest discover -s .agents/skills/elsa-release/tests -p 'test_release_train.py'
