name: Validate package publication gates

on:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/validate-packages-gates.yml'
      - 'scripts/validate_packages_workflow_gates.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/validate-packages-gates.yml'
      - 'scripts/validate_packages_workflow_gates.py'

permissions:
  contents: read

jobs:
  validate-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/validate_packages_workflow_gates.py
