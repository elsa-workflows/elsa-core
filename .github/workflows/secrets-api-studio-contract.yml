name: Secrets API and Studio source contract

on:
  pull_request:
    paths:
      - 'scripts/integration-program/secrets-api-studio-contract.json'
      - 'scripts/integration-program/verify_secrets_api_studio_contract.py'
      - 'scripts/integration-program/test_secrets_api_studio_contract.py'
      - 'scripts/integration-program/secrets-api-studio-contract/global.json'
      - 'doc/integration-program/secrets-collision-compatibility.md'
      - 'test/unit/Elsa.Secrets.UnitTests/SecretsApiContractTests.cs'
      - 'test/integration/Elsa.Secrets.Api.IntegrationTests/**'
      - 'Elsa.sln'
      - '.github/workflows/secrets-api-studio-contract.yml'

permissions:
  contents: read

jobs:
  pinned-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-core
          ref: 7b06b82d0ea89c12d49c3c28da8d770bfca13faf
          path: .contract-sources/core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/Elsa.Secrets/Endpoints/Secrets
            src/modules/Elsa.Secrets/Models
            src/modules/Elsa.Secrets/Features

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-extensions
          ref: 154ba15fb4da85b4bebecfbe43639579cbda1d0d
          path: .contract-sources/extensions
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/secrets

      - name: Fetch legacy Secrets row-schema source pin
        run: git -C .contract-sources/extensions fetch --no-tags --depth=1 origin 01bf9ad70d0399afadae9609fe820703d3de290d

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-studio
          ref: 20ceaeeed7e671f0c9662003e82063026f2216de
          path: .contract-sources/studio
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/Elsa.Studio.Secrets

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compare pinned routes, permissions and DTO contracts
        run: |
          python -m unittest discover -s scripts/integration-program -p 'test_secrets_api_studio_contract.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_secrets_api_studio_contract.py'
          python scripts/integration-program/verify_secrets_api_studio_contract.py \
            --core .contract-sources/core \
            --extensions .contract-sources/extensions \
            --studio .contract-sources/studio

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'

      - name: Test Core route and permission configuration
        working-directory: scripts/integration-program/secrets-api-studio-contract
        run: |
          dotnet --version
          dotnet test "$GITHUB_WORKSPACE/test/unit/Elsa.Secrets.UnitTests/Elsa.Secrets.UnitTests.csproj" \
            --configuration Release --framework net10.0 \
            --filter FullyQualifiedName~SecretsApiContractTests --nologo

      - name: Test HTTP behavior through the pinned Studio Refit client
        working-directory: scripts/integration-program/secrets-api-studio-contract
        run: |
          dotnet test "$GITHUB_WORKSPACE/test/integration/Elsa.Secrets.Api.IntegrationTests/Elsa.Secrets.Api.IntegrationTests.csproj" \
            --configuration Release --framework net10.0 --nologo
