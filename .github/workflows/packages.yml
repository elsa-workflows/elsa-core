name: Packages

on:
  workflow_dispatch:
    inputs:
      qualify_release:
        description: Build and retain the exact patch packages without publishing
        type: boolean
        default: false
  push:
    branches:
      - 'main'
      - 'bug/*'
      - 'perf/*'
      - 'patch/*'
      - 'feat/*'
      - 'enh/*'
      - 'rc/*'
      - 'develop/*'
      - 'release/*'
      - 'codex/*'

env:
  base_version: '3.7.2'

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Elsa.sln --ignore-failed-sources

      - name: Prepare coverage directory
        run: |
          rm -rf artifacts/coverage
          mkdir -p artifacts/coverage

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --version | grep -q '^10\.'; then
            echo "Expected .NET SDK 10.x but got $(dotnet --version)" >&2
            exit 1
          fi

          # Discover test projects across unit/component/integration.
          mapfile -t projects < <(
            find test/unit test/component test/integration \
              -type f -name '*.csproj' -print0 2>/dev/null \
              | xargs -0 -n1 \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects were found in test/unit, test/component or test/integration." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Building test project ${project}"
            dotnet build "$project" --configuration Release --framework net10.0

            echo "Running tests with coverage for ${project}"
            dotnet test "$project" \
              --configuration Release \
              --framework net10.0 \
              --no-build \
              --logger "GitHubActions;report-warnings=false" \
              /p:CollectCoverage=true
          done

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            "-reports:./artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:./artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "-verbosity:Info"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage

      - name: Upload Pages artifact
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/coverage-report'

  build:
    name: Build packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Extract branch name
        run: |
          BRANCH_NAME=${{ github.ref }} # e.g., refs/heads/main
          BRANCH_NAME=${BRANCH_NAME#refs/heads/} # remove the refs/heads/ prefix
          # Extract the last part after the last slash of the branch name, if any, e.g., feature/issue-123 -> issue-123 and use it as the version prefix.
          PACKAGE_PREFIX=$(echo $BRANCH_NAME | rev | cut -d/ -f1 | rev | tr '_' '-')

          # If the branch name is main, use the preview version. Otherwise, use the branch name as the version prefix.
          if [[ "${BRANCH_NAME}" == "main" || "${BRANCH_NAME}" =~ ^develop/ || "${BRANCH_NAME}" =~ ^release/ ]]; then
              PACKAGE_PREFIX="preview"
          fi

          echo "Ref: ${{ github.ref }}"
          echo "Branch name: ${BRANCH_NAME}"
          echo "Package prefix: ${PACKAGE_PREFIX}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_PREFIX=${PACKAGE_PREFIX}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package version
        env:
          QUALIFY_RELEASE: ${{ inputs.qualify_release }}
        run: |
          set -euo pipefail
          if [[ "${QUALIFY_RELEASE}" == "true" ]]; then
            test "$GITHUB_REF" = 'refs/heads/release/3.7.2'
            echo "VERSION=${base_version}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${base_version}-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Compile+Pack
        run: ./build.sh Compile+Pack --version ${VERSION} --analyseCode true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-nuget-packages
          path: packages/*nupkg
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualify_release) }}

  deploy_coverage:
    name: Deploy coverage to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop/3.6.1' || github.ref == 'refs/heads/release/3.6.1'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
