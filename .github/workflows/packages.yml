name: Packages

on:
  workflow_dispatch:
    inputs:
      qualify_release:
        description: Build and retain the exact patch packages without publishing
        type: boolean
        default: false
  push:
    branches:
      - 'main'
      - 'bug/*'
      - 'perf/*'
      - 'patch/*'
      - 'feat/*'
      - 'enh/*'
      - 'rc/*'
      - 'develop/*'
      - 'release/*'
      - 'codex/*'

env:
  base_version: '3.9.1'

jobs:
  test_unit_integration:
    name: Test unit/integration with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Elsa.sln --ignore-failed-sources

      - name: Prepare coverage directory
        run: |
          rm -rf artifacts/coverage
          mkdir -p artifacts/coverage

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --version | grep -q '^10\.'; then
            echo "Expected .NET SDK 10.x but got $(dotnet --version)" >&2
            exit 1
          fi

          # Discover unit and integration test projects. Component tests run in their own job.
          mapfile -t projects < <(
            find test/unit test/integration \
              -type f -name '*.csproj' -print0 2>/dev/null \
              | xargs -0 -n1 \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects were found in test/unit or test/integration." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Building test project ${project}"
            dotnet build "$project" --configuration Release --framework net10.0

            echo "Running tests with coverage for ${project}"
            dotnet test "$project" \
              --configuration Release \
              --framework net10.0 \
              --no-build \
              --logger "GitHubActions;report-warnings=false" \
              /p:CollectCoverage=true
          done

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-coverage-reports
          path: artifacts/coverage

  test_component:
    name: Test component with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Elsa.sln --ignore-failed-sources

      - name: Prepare test artifact directories
        run: |
          rm -rf artifacts/coverage artifacts/test-results
          mkdir -p artifacts/coverage artifacts/test-results/component

      - name: Run component tests with coverage and hang diagnostics
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --version | grep -q '^10\.'; then
            echo "Expected .NET SDK 10.x but got $(dotnet --version)" >&2
            exit 1
          fi

          mapfile -t projects < <(
            find test/component \
              -type f -name '*.csproj' -print0 2>/dev/null \
              | xargs -0 -n1 \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects were found in test/component." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Building component test project ${project}"
            dotnet build "$project" --configuration Release --framework net10.0

            echo "Running component tests with coverage and hang diagnostics for ${project}"
            dotnet test "$project" \
              --configuration Release \
              --framework net10.0 \
              --no-build \
              --logger "GitHubActions;report-warnings=false" \
              --logger "trx" \
              --results-directory artifacts/test-results/component \
              --verbosity detailed \
              --blame-hang \
              --blame-hang-timeout 2m \
              --blame-hang-dump-type mini \
              /p:CollectCoverage=true
          done

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-coverage-reports
          path: artifacts/coverage

      - name: Upload component test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-diagnostics
          path: artifacts/test-results

  coverage_report:
    name: Generate coverage report
    needs:
      - test_unit_integration
      - test_component
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !cancelled() && needs.test_unit_integration.result == 'success' && needs.test_component.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage-reports'
          path: artifacts/coverage
          merge-multiple: true

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            "-reports:./artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:./artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "-verbosity:Info"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/coverage-report'

  build:
    name: Build packages
    needs:
      - test_unit_integration
      - test_component
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package version
        env:
          QUALIFY_RELEASE: ${{ inputs.qualify_release }}
        run: |
          set -euo pipefail
          if [[ "${QUALIFY_RELEASE}" == "true" ]]; then
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$GITHUB_REF" = 'refs/heads/release/3.9.0'
            echo "VERSION=${base_version}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${base_version}-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Compile+Pack
        run: ./build.sh Compile+Pack --version ${VERSION} --analyseCode true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-nuget-packages
          path: packages/*nupkg
        if: ${{ github.event_name == 'push' }}

      - name: Seal the exact patch artifact
        if: ${{ inputs.qualify_release }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          destination = Path(os.environ["RUNNER_TEMP"]) / "core-candidate"
          artifacts = destination / "artifacts"
          artifacts.mkdir(parents=True)
          # The sample fixture has its own fixed version and is not a release package.
          packages = sorted(pkg for pkg in Path("packages").glob("*nupkg") if pkg.name != "Elsa.SamplePackage.1.0.1.nupkg")
          version = os.environ["VERSION"]
          binaries = {pkg.name.removesuffix(".nupkg") for pkg in packages if pkg.name.endswith(f".{version}.nupkg")}
          symbols = {pkg.name.removesuffix(".snupkg") for pkg in packages if pkg.name.endswith(f".{version}.snupkg")}
          if not binaries or symbols != binaries or len(packages) != len(binaries) * 2:
              raise SystemExit("Expected only complete package and symbol pairs at the requested version.")
          files = []
          for package in packages:
              shutil.copyfile(package, artifacts / package.name)
              with package.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              files.append({"path": f"artifacts/{package.name}", "size": package.stat().st_size, "sha256": digest})
          manifest = {
              "schema": 1,
              "published": False,
              "version": version,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "files": files,
          }
          (destination / "preupload-manifest.json").write_text(json.dumps(manifest) + "\n")
          PYTHON

      - name: Retain the sealed patch artifact
        if: ${{ inputs.qualify_release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-candidate
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  deploy_coverage:
    name: Deploy coverage to GitHub Pages
    needs: coverage_report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop/3.6.1' || github.ref == 'refs/heads/release/3.6.1'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
