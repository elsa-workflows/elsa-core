name: Packages
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'vnext'
      - 'bug/*'
      - 'enh/*'
      - 'feat/*'
      - 'issue/*'
      - 'patch/*'
      - 'rc/*'
      - 'develop/*'
      - 'release/*'
  release:
    # `published` fires for pre-releases too. Subscribing to `prereleased` as well
    # produced two runs per release, and the feedz publish jobs (which are not gated
    # on the action) then raced: the second run failed with npm EPUBLISHCONFLICT.
    types: [ published ]
env:
  base_version: '3.8.0'
  nuget_feed_feedzio: 'https://f.feedz.io/elsa-workflows/elsa-3/nuget/index.json'
  nuget_feed_nuget: 'https://api.nuget.org/v3/index.json'
  npm_feed_feedzio: 'https://f.feedz.io/elsa-workflows/elsa-3/npm/'
  npm_feed_npm: 'https://registry.npmjs.org/'

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract branch name
        run: |
          BRANCH_NAME=${{ github.ref }} # e.g., refs/heads/main
          BRANCH_NAME=${BRANCH_NAME#refs/heads/} # remove the refs/heads/ prefix
          # Extract the last part after the last slash of the branch name, if any, e.g., feature/issue-123 -> issue-123 and use it as the version prefix.
          PACKAGE_PREFIX=$(echo $BRANCH_NAME | rev | cut -d/ -f1 | rev | tr '_' '-')

          # If the branch name is main, use the preview version. Otherwise, use the branch name as the version prefix.
          if [[ "${BRANCH_NAME}" == "main" || "${BRANCH_NAME}" =~ ^rc/ || "${BRANCH_NAME}" =~ ^develop/ || "${BRANCH_NAME}" =~ ^patch/ || "${BRANCH_NAME}" =~ ^release/ ]]; then
              PACKAGE_PREFIX="preview"
          fi

          echo "Ref: ${{ github.ref }}"
          echo "Branch name: ${BRANCH_NAME}"
          echo "Package prefix: ${PACKAGE_PREFIX}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_PREFIX=${PACKAGE_PREFIX}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v3
      - name: Verify commit exists in remote branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.event_name }}" == "release" && ("${{ github.event.action }}" == "published" || "${{ github.event.action }}" == "prereleased") ]]; then
            git fetch --no-tags --prune --depth=50 origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep -E 'origin/(main|release/)'
          else
            git fetch --no-tags --prune --depth=50 origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep origin/${BRANCH_NAME}
          fi
      - name: Set VERSION variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.event_name }}" == "release" && ("${{ github.event.action }}" == "published" || "${{ github.event.action }}" == "prereleased") ]]; then
            TAG_NAME=${{ github.ref }} # e.g., refs/tags/3.0.0
            TAG_NAME=${TAG_NAME#refs/tags/} # remove the refs/tags/ prefix
            echo "VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "VERSION=${{env.base_version}}-${PACKAGE_PREFIX}.${{github.run_number}}" >> $GITHUB_ENV
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - name: Restore Bpmn.Model
        # Only Bpmn.Model's own schema/bpmn-payload.schema.json is needed here (see
        # ClientLib/scripts/generate-bpmn-types.js), but restoring the one project that downloads it
        # is cheap and keeps this from depending on solution-wide restore order.
        run: dotnet restore src/modules/Elsa.Studio.Workflows.Designer/Elsa.Studio.Workflows.Designer.csproj
      - name: Install workflow designer client dependencies
        working-directory: ./src/modules/Elsa.Studio.Workflows.Designer/ClientLib
        run: npm install --force
      - name: Verify generated BPMN types are up to date
        # This must run before "Build workflow designer client assets": that step's `npm run build`
        # regenerates src/bpmn/types.generated.ts as a side effect (via `npm run generate:bpmn-types`)
        # and overwrites it on disk, so running the check afterwards would diff the regenerated file
        # against itself and could never fail. This check also runs on pull requests via pr.yml.
        working-directory: ./src/modules/Elsa.Studio.Workflows.Designer/ClientLib
        run: |
          npm run check:generated
          npm test
      - name: Build workflow designer client assets
        working-directory: ./src/modules/Elsa.Studio.Workflows.Designer/ClientLib
        run: npm run build
      - name: Build DOM interop client assets
        working-directory: ./src/framework/Elsa.Studio.DomInterop/ClientLib
        run: |
          npm install --force
          npm run build
      - name: Build nuget packages
        run: dotnet build Elsa.Studio.sln --configuration Release /p:Version=${VERSION}
      - name: Test
        run: dotnet test Elsa.Studio.sln --configuration Release /p:Version=${VERSION} --no-build
      - name: Pack nuget packages
        run: dotnet pack Elsa.Studio.sln --configuration Release /p:Version=${VERSION} /p:PackageOutputPath=$(pwd)/packages/nuget
      - name: Publish Custom Elements packages # This generates client assets that we then package as an NPM package.
        run: dotnet publish ./src/hosts/Elsa.Studio.Host.CustomElements --configuration Release -o ./packages/wasm /p:Version=${VERSION} -f net10.0
      
      # Pack npm wasm package
      - name: Pack elsa-studio-wasm npm package
        run: |
          cp ./packages/wasm/npm/package.json ./packages/wasm/wwwroot/package.json # Copy the package.json file from the NPM package to the wwwroot folder.
          cd ./packages/wasm/wwwroot
          npm version $VERSION --allow-same-version
          npm pack
      
      # Build npm react wrapper package
      - name: Pack elsa-studio-wasm-react npm package
        run: |
          cd ./src/wrappers
          # npm version re-resolves the stale Feedz entry in package-lock.json.
          # Install the WASM tarball produced earlier in this run instead.
          npm pkg set "version=$VERSION" "dependencies.@elsa-workflows/elsa-studio-wasm=$VERSION" --workspace wrappers/react-wrapper
          npm install --force --no-save --package-lock=false "../../packages/wasm/wwwroot/elsa-workflows-elsa-studio-wasm-$VERSION.tgz"
          cd wrappers/react-wrapper
          npm run build
          npm pack
      
      # Upload nuget packages
      - name: Upload nuget packages
        uses: actions/upload-artifact@v4
        with:
          name: elsa-studio-nuget-packages
          path: ./packages/nuget/*nupkg
      
      # Upload npm wasm package
      - name: Upload npm wasm package
        uses: actions/upload-artifact@v4
        with:
          name: elsa-studio-npm-packages
          path: ./packages/wasm/wwwroot/*.tgz
      
      # Upload npm react wrapper package
      - name: Upload npm react wrapper package
        uses: actions/upload-artifact@v4
        with:
          name: elsa-studio-npm-react-packages
          path: ./src/wrappers/wrappers/react-wrapper/*.tgz

  publish_npm_preview_feedzio:
    name: Publish npm packages to feedz.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'release' || github.event_name == 'push'}}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.12.1
          registry-url: ${{ env.npm_feed_feedzio }}

      - name: Download npm Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-npm-packages
          path: elsa-studio-npm-packages

      - name: Publish npm packages to feedz.io
        run: |
          # npm has no --skip-duplicate. Re-publishing a version that already exists
          # (e.g. when a release is re-created for the same tag) returns EPUBLISHCONFLICT,
          # which is not a failure for us. Every other error still fails the job.
          status=0
          for file in ./elsa-studio-npm-packages/*.tgz
          do
            echo "Publishing $file"
            if output=$(npm publish "$file" --access public 2>&1); then
              echo "$output"
            else
              echo "$output"
              if echo "$output" | grep -qiE 'EPUBLISHCONFLICT|cannot publish over'; then
                echo "::notice::$file is already published at this version - skipping"
              else
                status=1
              fi
            fi
          done
          exit $status
        env:
          NODE_AUTH_TOKEN: ${{secrets.FEEDZ_API_KEY_BASE64}}

      - name: Download npm react Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-npm-react-packages
          path: elsa-studio-npm-react-packages

      - name: Publish npm react packages to feedz.io
        run: |
          # npm has no --skip-duplicate. Re-publishing a version that already exists
          # (e.g. when a release is re-created for the same tag) returns EPUBLISHCONFLICT,
          # which is not a failure for us. Every other error still fails the job.
          status=0
          for file in ./elsa-studio-npm-react-packages/*.tgz
          do
            echo "Publishing $file"
            if output=$(npm publish "$file" --access public 2>&1); then
              echo "$output"
            else
              echo "$output"
              if echo "$output" | grep -qiE 'EPUBLISHCONFLICT|cannot publish over'; then
                echo "::notice::$file is already published at this version - skipping"
              else
                status=1
              fi
            fi
          done
          exit $status
        env:
          NODE_AUTH_TOKEN: ${{secrets.FEEDZ_API_KEY_BASE64}}
  
  publish_npm_npm:
    name: Publish npm packages to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    permissions:
      contents: read
      id-token: write # Required: lets this job request the OIDC token npmjs.com exchanges for publish rights.
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.npm_feed_npm }}

      # npm's OIDC trusted publishing requires npm >= 11.5.1, which is newer than the
      # npm bundled with any current Node LTS, so upgrade it explicitly. Pinned to the
      # 11.x line rather than `latest` so a future npm major cannot change publish
      # behaviour without a deliberate bump here.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Download npm Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-npm-packages
          path: elsa-studio-npm-packages

      # No NODE_AUTH_TOKEN: publish rights come from the trusted publisher configured
      # on npmjs.com for elsa-workflows/elsa-studio + packages.yml. Kept strict (unlike
      # the feedz job) because this path has never published successfully -- an auth
      # failure here must stay loud.
      - name: Publish npm packages to npmjs.com
        run: |
          # npm 11 refuses to publish a prerelease without an explicit dist-tag, so it
          # cannot silently move `latest` to an rc. Derive the tag from each tarball's
          # own version: prereleases go to `next`, stable versions to `latest`.
          for file in ./elsa-studio-npm-packages/*.tgz
          do
            version=$(tar -xzOf "$file" package/package.json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            case "$version" in
              *-*) tag=next ;;
              *)   tag=latest ;;
            esac
            echo "Publishing $file ($version) with --tag $tag"
            npm publish "$file" --access public --tag "$tag"
          done

      - name: Download npm react Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-npm-react-packages
          path: elsa-studio-npm-react-packages

      - name: Publish npm react packages to npmjs.com
        run: |
          # npm 11 refuses to publish a prerelease without an explicit dist-tag, so it
          # cannot silently move `latest` to an rc. Derive the tag from each tarball's
          # own version: prereleases go to `next`, stable versions to `latest`.
          for file in ./elsa-studio-npm-react-packages/*.tgz
          do
            version=$(tar -xzOf "$file" package/package.json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            case "$version" in
              *-*) tag=next ;;
              *)   tag=latest ;;
            esac
            echo "Publishing $file ($version) with --tag $tag"
            npm publish "$file" --access public --tag "$tag"
          done

  publish_nuget_preview_feedzio:
    name: Publish nuget packages to feedz.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'release' || github.event_name == 'push'}}
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-nuget-packages
          path: elsa-studio-nuget-packages

      - name: Publish to feedz.io
        run: dotnet nuget push ./elsa-studio-nuget-packages/*.nupkg -k ${{ secrets.FEEDZ_API_KEY }} -s ${{ env.nuget_feed_feedzio }} --skip-duplicate

  publish_nuget_nuget:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    permissions:
      contents: read
      id-token: write # Required: lets this job request the OIDC token that nuget.org exchanges for a temporary API key.
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-studio-nuget-packages
          path: elsa-studio-nuget-packages

      # Exchanges a GitHub OIDC token for a temporary nuget.org API key (valid 1 hour).
      # Requires a Trusted Publishing policy on nuget.org matching:
      #   Repository Owner: elsa-workflows | Repository: elsa-studio | Workflow File: packages.yml
      # Keep this step immediately before the push so the key cannot expire in between.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), not an email address.

      - name: Publish to nuget.org
        run: dotnet nuget push ./elsa-studio-nuget-packages/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source ${{ env.nuget_feed_nuget }} --skip-duplicate
