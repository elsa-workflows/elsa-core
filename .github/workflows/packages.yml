name: Packages

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'bug/*'
      - 'perf/*'
      - 'patch/*'
      - 'feat/*'
      - 'enh/*'
      - 'rc/*'
      - 'develop/*'
      - 'release/*'
      - 'codex/*'
  release:
    # published covers stable releases and prereleases; subscribe once.
    types: [published]

env:
  base_version: '3.8.0'
  feedz_feed_source: 'https://f.feedz.io/elsa-workflows/elsa-3/nuget/index.json'
  nuget_feed_source: 'https://api.nuget.org/v3/index.json'

jobs:
  test_unit_integration:
    name: Test unit/integration with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore unit and integration tests
        run: dotnet restore Elsa.UnitIntegration.Tests.slnf --ignore-failed-sources

      - name: Prepare test results directory
        run: |
          rm -rf artifacts/test-results/unit-integration
          mkdir -p artifacts/test-results/unit-integration

      - name: Run unit and integration tests with coverage
        run: |
          set -euo pipefail
          dotnet test --solution Elsa.UnitIntegration.Tests.slnf \
            --configuration Release \
            --no-restore \
            --results-directory artifacts/test-results/unit-integration \
            -- \
            --coverage \
            --coverage-settings "$GITHUB_WORKSPACE/test/coverage.settings.xml" \
            --coverage-output-format cobertura \
            --report-trx

          coverage_count=$(find artifacts/test-results/unit-integration -maxdepth 1 -type f -name '*.cobertura.xml' | wc -l | tr -d ' ')
          if [[ "$coverage_count" != "59" ]]; then
            echo "Expected 59 unit/integration coverage files, found $coverage_count." >&2
            exit 1
          fi

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload unit and integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-test-results
          path: artifacts/test-results/unit-integration

  test_component:
    name: Test component with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore component tests
        run: dotnet restore Elsa.Component.Tests.slnf --ignore-failed-sources

      - name: Prepare test results directory
        run: |
          rm -rf artifacts/test-results/component
          mkdir -p artifacts/test-results/component

      - name: Run component tests with coverage and hang diagnostics
        run: |
          set -euo pipefail
          dotnet test --solution Elsa.Component.Tests.slnf \
            --configuration Release \
            --no-restore \
            --results-directory artifacts/test-results/component \
            -- \
            --coverage \
            --coverage-settings "$GITHUB_WORKSPACE/test/coverage.settings.xml" \
            --coverage-output-format cobertura \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini

          coverage_count=$(find artifacts/test-results/component -maxdepth 1 -type f -name '*.cobertura.xml' | wc -l | tr -d ' ')
          if [[ "$coverage_count" != "1" ]]; then
            echo "Expected one component coverage file, found $coverage_count." >&2
            exit 1
          fi

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: artifacts/test-results/component

  coverage_report:
    name: Generate coverage report
    needs:
      - test_unit_integration
      - test_component
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !cancelled() && needs.test_unit_integration.result == 'success' && needs.test_component.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Download unit and integration test results
        uses: actions/download-artifact@v4
        with:
          name: unit-integration-test-results
          path: artifacts/test-results/unit-integration

      - name: Download component test results
        uses: actions/download-artifact@v4
        with:
          name: component-test-results
          path: artifacts/test-results/component

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

      - name: Generate HTML coverage report
        run: |
          dotnet tool run reportgenerator \
            "-reports:./artifacts/test-results/**/*.cobertura.xml" \
            "-targetdir:./artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "--minimumCoverageThresholds:lineCoverage=10" \
            "-verbosity:Info"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage-report

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/coverage-report'

  build:
    name: Build packages
    needs:
      - test_unit_integration
      - test_component
      - coverage_report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' && needs.coverage_report.result == 'success' }}
    steps:
      - name: Extract branch name
        run: |
          BRANCH_NAME=${{ github.ref }} # e.g., refs/heads/main
          BRANCH_NAME=${BRANCH_NAME#refs/heads/} # remove the refs/heads/ prefix
          # Extract the last part after the last slash of the branch name, if any, e.g., feature/issue-123 -> issue-123 and use it as the version prefix.
          PACKAGE_PREFIX=$(echo $BRANCH_NAME | rev | cut -d/ -f1 | rev | tr '_' '-')

          # If the branch name is main, use the preview version. Otherwise, use the branch name as the version prefix.
          if [[ "${BRANCH_NAME}" == "main" || "${BRANCH_NAME}" =~ ^develop/ || "${BRANCH_NAME}" =~ ^release/ ]]; then
              PACKAGE_PREFIX="preview"
          fi

          echo "Ref: ${{ github.ref }}"
          echo "Branch name: ${BRANCH_NAME}"
          echo "Package prefix: ${PACKAGE_PREFIX}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_PREFIX=${PACKAGE_PREFIX}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify commit exists in branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.event_name }}" == "release" && ("${{ github.event.action }}" == "published" || "${{ github.event.action }}" == "prereleased") ]]; then
            git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep -E 'origin/(main|release/)'
          else
            git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep origin/${BRANCH_NAME}
          fi

      - name: Set VERSION variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.event_name }}" == "release" && ("${{ github.event.action }}" == "published" || "${{ github.event.action }}" == "prereleased") ]]; then
            TAG_NAME=${{ github.ref }} # e.g., refs/tags/3.0.0
            TAG_NAME=${TAG_NAME#refs/tags/} # remove the refs/tags/ prefix
            echo "VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "VERSION=${{env.base_version}}-preview.${{github.run_number}}" >> $GITHUB_ENV
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Compile+Pack
        run: ./build.sh Compile+Pack --version ${VERSION} --analyseCode true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-nuget-packages
          path: packages/*nupkg
        if: ${{ github.event_name == 'release' || github.event_name == 'push'}}

  publish_preview_feedz:
    name: Publish to feedz.io
    needs: build
    runs-on: ubuntu-latest
    # 30 minutes against the push action's 20-minute deadline: the action stops
    # starting pushes once its own deadline passes, so the runner never has to
    # cancel a publish half-done. Move the two together.
    timeout-minutes: 30
    if: ${{ github.event_name == 'release' || github.event_name == 'push'}}
    steps:
      - name: Check out the push action
        # Every third-party action in this job runs before a feed API key is handed
        # to the local composite, in the same writable workspace, so each one is
        # pinned to a full commit SHA. A mutable tag here could be retargeted to
        # substitute the composite before it receives the credential.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download Packages
        # Pinned for the reason given on the checkout above.
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: elsa-nuget-packages

      - name: Publish to feedz.io
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.feedz_feed_source }}
          api-key: ${{ secrets.FEEDZ_API_KEY }}

  publish_nuget:
    name: Publish release to nuget.org
    needs: build
    runs-on: ubuntu-latest
    # 30 minutes against the push action's 20-minute deadline: the action stops
    # starting pushes once its own deadline passes, so the runner never has to
    # cancel a publish half-done. Move the two together.
    timeout-minutes: 30
    if: ${{ github.event.action == 'published' }}
    permissions:
      contents: read
      id-token: write # Required: lets this job request the OIDC token that nuget.org exchanges for a temporary API key.
    steps:
      - name: Check out the push action
        # Every third-party action in this job runs before a feed API key is handed
        # to the local composite, in the same writable workspace, so each one is
        # pinned to a full commit SHA. A mutable tag here could be retargeted to
        # substitute the composite before it receives the credential.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download Packages
        # Pinned for the reason given on the checkout above.
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: elsa-nuget-packages

      # Exchanges a GitHub OIDC token for a temporary nuget.org API key (valid 1 hour).
      # Requires a Trusted Publishing policy on nuget.org matching:
      #   Repository Owner: elsa-workflows | Repository: elsa-core | Workflow File: packages.yml
      # Keep this step immediately before the push so the key cannot expire in between.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), not an email address.

      - name: Publish to nuget.org
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.nuget_feed_source }}
          api-key: ${{ secrets.NUGET_API_KEY }}

  deploy_coverage:
    name: Deploy coverage to GitHub Pages
    needs: coverage_report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop/3.6.1' || github.ref == 'refs/heads/release/3.6.1'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
