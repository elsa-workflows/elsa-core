name: Packages

on:
  workflow_dispatch:
    inputs:
      publish_preview_feedz:
        description: Publish this run's packages to Feedz - branch previews, or a 3.10.x prerelease tag (requires publisher approval). Stable 3.10.x Feedz is owned by promote_candidate_version.
        required: true
        type: boolean
        default: false
      publish_nuget:
        description: Publish a release-tag package to NuGet.org for this run (requires publisher approval). Stable 3.10.0 nuget.org publishes the pinned 231-ID candidate.
        required: true
        type: boolean
        default: false
      publish_npm:
        description: Publish the Studio npm pair to Feedz for this run (requires publisher approval). Live for 3.10.x prerelease tags. npmjs.com is not in this job until trusted publishing is confirmed. Stable 3.10.x stays fail-closed until the 231-ID nuget.org promote guard can pass.
        required: true
        type: boolean
        default: false
      deploy_coverage:
        description: Deploy coverage to GitHub Pages for this run (requires deployment approval).
        required: true
        type: boolean
        default: false
      exclude_ids:
        description: Optional comma-separated package IDs skipped by a publish_nuget dispatch on a stable 3.10 tag. Empty means none. Rejected on any other path.
        required: false
        type: string
        default: ''
      promote_candidate_version:
        description: Promote the already-built candidate pinned for this version in .github/release-pins/consolidated.json (for example 3.10.1) to Feedz and nuget.org, each behind its environment approval. Main only; no rebuild, no tag. Leave empty for every other run.
        required: false
        type: string
        default: ''
      promote_target:
        description: Which publisher a candidate promotion runs, only with promote_candidate_version. all runs Feedz and nuget.org; feedz or nuget runs just that one. Every verification step runs either way. Leave as all for every other run.
        required: true
        type: choice
        options:
          - all
          - feedz
          - nuget
        default: all
  push:
    branches:
      - 'main'
      - 'release/*'
  release:
    # published covers stable releases and prereleases; subscribe once.
    types: [published]

# A push never publishes, so a newer push to the same branch supersedes it.
# Release and dispatch runs each get their own group and are never cancelled or replaced.
concurrency:
  group: packages-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  base_version: '3.10.0'
  feedz_feed_source: 'https://f.feedz.io/elsa-workflows/elsa-3/nuget/index.json'
  nuget_feed_source: 'https://api.nuget.org/v3/index.json'

jobs:
  validate_publication_selection:
    name: Validate publication selection
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selection check
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
          fetch-depth: 1

      # Strict release tags only. Tested by
      # scripts/test_validate_packages_publication_selection.py.
      - name: Reject incompatible publication refs
        env:
          REF: ${{ github.ref }}
          PUBLISH_PREVIEW_FEEDZ: ${{ inputs.publish_preview_feedz }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          DEPLOY_COVERAGE: ${{ inputs.deploy_coverage }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          PROMOTE_CANDIDATE_VERSION: ${{ inputs.promote_candidate_version }}
          PROMOTE_TARGET: ${{ inputs.promote_target }}
        run: python3 scripts/validate_packages_publication_selection.py

  test_unit_integration:
    name: Test unit/integration with coverage
    # A candidate promotion installs pinned, already-tested bytes: nothing is built or tested.
    if: ${{ inputs.promote_candidate_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      # Hosted images can default to a newer SDK major; keep the tests on the newest installed 10.0.x SDK.
      - name: Pin the .NET 10 SDK
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Elsa.sln --ignore-failed-sources

      - name: Prepare coverage directory
        run: |
          rm -rf artifacts/coverage
          mkdir -p artifacts/coverage

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --version | grep -q '^10\.'; then
            echo "Expected .NET SDK 10.x but got $(dotnet --version)" >&2
            exit 1
          fi

          # Discover unit and integration test projects. Component tests run in their own job.
          mapfile -t projects < <(
            find core/test/unit core/test/integration \
              -type f -name '*.csproj' -print0 2>/dev/null \
              | xargs -0 -n1 \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects were found in core/test/unit or core/test/integration." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            # Run on net10.0 where the project targets it. A project that cannot (the MySQL tests, because Pomelo
            # stops at EF Core 9) runs on its single target framework and rolls forward to the 10.x runtime.
            framework=net10.0
            target_frameworks="$(dotnet msbuild "$project" -getProperty:TargetFrameworks)"
            target_framework="$(dotnet msbuild "$project" -getProperty:TargetFramework)"
            if [[ ";${target_frameworks};${target_framework};" != *";net10.0;"* ]]; then
              framework="${target_framework}"
              if [ -z "$framework" ]; then
                echo "${project} does not target net10.0 and declares no single TargetFramework to run instead." >&2
                exit 1
              fi
            fi

            echo "Building test project ${project} (${framework})"
            dotnet build "$project" --configuration Release --framework "$framework"

            echo "Running tests with coverage for ${project} (${framework})"
            dotnet test "$project" \
              --configuration Release \
              --framework "$framework" \
              --no-build \
              --logger "GitHubActions;report-warnings=false" \
              /p:CollectCoverage=true
          done

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-coverage-reports
          path: artifacts/coverage

  test_component:
    name: Test component with coverage
    # A candidate promotion installs pinned, already-tested bytes: nothing is built or tested.
    if: ${{ inputs.promote_candidate_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      # Hosted images can default to a newer SDK major; keep the tests on the newest installed 10.0.x SDK.
      - name: Pin the .NET 10 SDK
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Elsa.sln --ignore-failed-sources

      - name: Prepare test artifact directories
        run: |
          rm -rf artifacts/coverage artifacts/test-results
          mkdir -p artifacts/coverage artifacts/test-results/component

      - name: Run component tests with coverage and hang diagnostics
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --version | grep -q '^10\.'; then
            echo "Expected .NET SDK 10.x but got $(dotnet --version)" >&2
            exit 1
          fi

          mapfile -t projects < <(
            find core/test/component \
              -type f -name '*.csproj' -print0 2>/dev/null \
              | xargs -0 -n1 \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects were found in core/test/component." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Building component test project ${project}"
            dotnet build "$project" --configuration Release --framework net10.0

            echo "Running component tests with coverage and hang diagnostics for ${project}"
            dotnet test "$project" \
              --configuration Release \
              --framework net10.0 \
              --no-build \
              --logger "GitHubActions;report-warnings=false" \
              --logger "trx" \
              --results-directory artifacts/test-results/component \
              --verbosity detailed \
              --blame-hang \
              --blame-hang-timeout 2m \
              --blame-hang-dump-type mini \
              /p:CollectCoverage=true
          done

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-coverage-reports
          path: artifacts/coverage

      - name: Upload component test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-diagnostics
          path: artifacts/test-results

  coverage_report:
    name: Generate coverage report
    needs:
      - test_unit_integration
      - test_component
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !cancelled() && needs.test_unit_integration.result == 'success' && needs.test_component.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage-reports'
          path: artifacts/coverage
          merge-multiple: true

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            "-reports:./artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:./artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "-verbosity:Info"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/coverage-report'

  build:
    name: Build packages
    needs:
      - test_unit_integration
      - test_component
      - validate_publication_selection
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Push and release events build as before; the selection check only runs on
    # manual dispatch, and a dispatch it rejects must not build.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test_unit_integration.result == 'success' && needs.test_component.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.validate_publication_selection.result == 'success') }}
    steps:
      - name: Extract branch name
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH_NAME="${REF}" # e.g., refs/heads/main
          BRANCH_NAME=${BRANCH_NAME#refs/heads/} # remove the refs/heads/ prefix
          # Extract the last part after the last slash of the branch name, if any, e.g., feature/issue-123 -> issue-123 and use it as the version prefix.
          PACKAGE_PREFIX=$(echo "${BRANCH_NAME}" | rev | cut -d/ -f1 | rev | tr '_' '-')

          # If the branch name is main, use the preview version. Otherwise, use the branch name as the version prefix.
          if [[ "${BRANCH_NAME}" == "main" || "${BRANCH_NAME}" =~ ^develop/ || "${BRANCH_NAME}" =~ ^release/ ]]; then
              PACKAGE_PREFIX="preview"
          fi

          echo "Ref: ${REF}"
          echo "Branch name: ${BRANCH_NAME}"
          echo "Package prefix: ${PACKAGE_PREFIX}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_PREFIX=${PACKAGE_PREFIX}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify commit exists in branch
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${REF}" == refs/tags/* && ("${EVENT_NAME}" == "release" || "${EVENT_NAME}" == "workflow_dispatch") ]]; then
            git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep -E 'origin/(main|release/)'
          else
            git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
            git branch --remote --contains | grep "origin/${BRANCH_NAME}"
          fi

      - name: Set VERSION variable
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${REF}" == refs/tags/* && ("${EVENT_NAME}" == "release" || "${EVENT_NAME}" == "workflow_dispatch") ]]; then
            TAG_NAME="${REF}" # e.g., refs/tags/3.0.0
            TAG_NAME=${TAG_NAME#refs/tags/} # remove the refs/tags/ prefix
            VERSION="${TAG_NAME}"
          else
            VERSION="${{env.base_version}}-preview.${{github.run_number}}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # Stable 3.10.0 nuget.org stages the pinned candidate; this job must not pack.
      - uses: actions/setup-dotnet@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) }}
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.x

      # Keep packing on the newest installed 10.0.x SDK, like the test jobs.
      - name: Pin the .NET 10 SDK
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) }}
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/tags/3.10.0' && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget) }}
        with:
          python-version: '3.12'

      # NUKE builds the embedded React assets before Compile and Pack. Keep the
      # existing 3.10 release base; React packages are eligible starting at 3.11.
      - name: Set up Node for React Studio assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Compile+Pack
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) || ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/tags/3.10.0')) }}
        run: ./build.sh Compile+Pack --version "${VERSION}" --analyseCode true

      # --version 3.10.0 matches the refs/tags/3.10.0 guard above. The inventory
      # baseline is per branch: this file on main is main's evaluation. A [3.10]
      # pick must regenerate it from release/3.10.0; the two are not the same.
      - name: Pack consolidated 3.10.0 set
        if: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/tags/3.10.0' && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget) }}
        env:
          PACKAGES_DIR: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail
          python3 scripts/integration-program/prepare_consolidated_release_candidate.py --version 3.10.0 --output "$RUNNER_TEMP/consolidated-candidate" --remote-sources
          python3 scripts/validate_packages_id_set.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-nuget-packages
          path: packages/*nupkg
        if: ${{ (github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish_preview_feedz || inputs.publish_nuget))) && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) }}

  publish_preview_feedz:
    name: Publish to feedz.io
    needs: [build, validate_publication_selection]
    runs-on: ubuntu-latest
    # 30 minutes against the push action's 20-minute deadline: the action stops
    # starting pushes once its own deadline passes, so the runner never has to
    # cancel a publish half-done. Move the two together.
    timeout-minutes: 30
    # Push and release events stay non-publishing. An approved operator must
    # dispatch this workflow and opt in for this run: from a branch for previews,
    # or from a 3.10.x prerelease tag. Stable 3.10.x Feedz is owned only by
    # the candidate executor.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_preview_feedz && (startsWith(github.ref, 'refs/heads/') || (startsWith(github.ref, 'refs/tags/3.10.') && contains(github.ref_name, '-'))) }}
    steps:
      - name: Check out the push action
        # Every third-party action in this job runs before a feed API key is handed
        # to the local composite, in the same writable workspace, so each one is
        # pinned to a full commit SHA. A mutable tag here could be retargeted to
        # substitute the composite before it receives the credential.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download Packages
        # Pinned for the reason given on the checkout above.
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: elsa-nuget-packages

      - name: Publish to feedz.io
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.feedz_feed_source }}
          api-key: ${{ secrets.FEEDZ_API_KEY }}

  publish_nuget:
    name: Publish release to nuget.org
    needs: [build, validate_publication_selection]
    runs-on: ubuntu-latest
    # 30 minutes against the push action's 20-minute deadline: the action stops
    # starting pushes once its own deadline passes, so the runner never has to
    # cancel a publish half-done. Move the two together.
    timeout-minutes: 30
    # NuGet publication requires an explicit dispatch on a release tag. Stable
    # 3.10.0 stages the pinned candidate; other tags push this run's pack.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      actions: read # Stable 3.10.x reads the pinned candidate artifact; unused on other tags.
      id-token: write # Required: lets this job request the OIDC token that nuget.org exchanges for a temporary API key.
    steps:
      - name: Check out the push action
        # Every third-party action in this job runs before a feed API key is handed
        # to the local composite, in the same writable workspace, so each one is
        # pinned to a full commit SHA. A mutable tag here could be retargeted to
        # substitute the composite before it receives the credential.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/actions
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Download Packages
        # Pinned for the reason given on the checkout above. Skipped for stable
        # 3.10.0, which stages the pinned 231-ID candidate.
        if: ${{ !(startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-')) }}
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: elsa-nuget-packages

      - name: Retrieve verified candidate archive
        if: ${{ startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/candidate.zip
        run: python3 scripts/stage_consolidated_candidate_nupkgs.py retrieve

      - name: Stage and guard verified candidate packages
        if: ${{ startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-') }}
        env:
          REF: ${{ github.ref }}
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/candidate.zip
          PACKAGES_DIR: ${{ github.workspace }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
        run: |
          python3 scripts/stage_consolidated_candidate_nupkgs.py stage
          python3 scripts/validate_packages_id_set.py

      # Exchanges a GitHub OIDC token for a temporary nuget.org API key (valid 1 hour).
      # Requires a Trusted Publishing policy on nuget.org matching:
      #   Repository Owner: elsa-workflows | Repository: elsa-core | Workflow File: packages.yml
      # Keep this step immediately before the push so the key cannot expire in between.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), not an email address.

      - name: Publish to nuget.org
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.nuget_feed_source }}
          api-key: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

  build_npm:
    name: Build Studio npm pair
    needs: [build, validate_publication_selection]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    steps:
      - name: Check out the Studio npm pair
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build the Studio npm pair
        run: |
          set -euo pipefail
          python3 scripts/integration-program/prove_studio_npm_pair.py \
            --commit "${GITHUB_SHA}" --version "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --release-candidate --output "$RUNNER_TEMP/studio-npm-pair"

      - name: Upload Studio npm pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-npm-pair
          path: ${{ runner.temp }}/studio-npm-pair/retained/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish_npm:
    name: Publish Studio npm pair
    needs: [build_npm, validate_publication_selection]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    steps:
      - name: Fail closed on stable 3.10.x
        if: ${{ startsWith(github.ref, 'refs/tags/3.10.') && !contains(github.ref_name, '-') }}
        run: |
          echo "Stable 3.10.x Studio npm pair stays fail-closed until the 231-ID nuget.org promote guard can pass."
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Configure Feedz registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://f.feedz.io/elsa-workflows/elsa-3/npm/

      - name: Download Studio npm pair
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: studio-npm-pair
          path: ${{ runner.temp }}/studio-npm-pair

      - name: Verify Studio npm pair
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/studio-npm-pair"
          wasm="elsa-workflows-elsa-studio-wasm-${GITHUB_REF_NAME}.tgz"
          react="elsa-workflows-elsa-studio-wasm-react-${GITHUB_REF_NAME}.tgz"
          test -f "$dir/$wasm"
          test -f "$dir/$react"
          count=$(find "$dir" -maxdepth 1 -name '*.tgz' | wc -l)
          test "$count" -eq 2

      - name: Publish @elsa-workflows/elsa-studio-wasm to Feedz
        id: publish_wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FEEDZ_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Feedz npm key resolved empty; nothing was published."
            exit 1
          fi
          version="${GITHUB_REF_NAME}"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          wasm="elsa-workflows-elsa-studio-wasm-${version}.tgz"
          python3 scripts/publish_npm_tarball.py \
            --tarball "$RUNNER_TEMP/studio-npm-pair/$wasm" \
            --package "@elsa-workflows/elsa-studio-wasm" \
            --version "$version" \
            --tag "$tag" \
            --registry "https://f.feedz.io/elsa-workflows/elsa-3/npm/" \
            --verify-published
          echo "wasm-published=true" >> "$GITHUB_OUTPUT"

      - name: Publish @elsa-workflows/elsa-studio-wasm-react to Feedz
        if: steps.publish_wasm.outputs.wasm-published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FEEDZ_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Feedz npm key resolved empty; nothing was published."
            exit 1
          fi
          version="${GITHUB_REF_NAME}"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          react="elsa-workflows-elsa-studio-wasm-react-${version}.tgz"
          python3 scripts/publish_npm_tarball.py \
            --tarball "$RUNNER_TEMP/studio-npm-pair/$react" \
            --package "@elsa-workflows/elsa-studio-wasm-react" \
            --version "$version" \
            --tag "$tag" \
            --registry "https://f.feedz.io/elsa-workflows/elsa-3/npm/" \
            --verify-published

  deploy_coverage:
    name: Deploy coverage to GitHub Pages
    needs: [coverage_report, validate_publication_selection]
    runs-on: ubuntu-latest
    # Coverage deployment is also a per-run opt-in; pushes only build the report.
    # Only refs whose coverage_report run uploads a Pages artifact.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_coverage && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/3.6.1') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --- Candidate promotion (promote_candidate_version) ---------------------------------------------------
  # Installs an already-built, unpublished candidate pinned in .github/release-pins/consolidated.json to Feedz
  # and nuget.org. The same steps run for every version: adding a version is one reviewed pin entry. Nothing is
  # rebuilt and no tag is created (Release pushes the tag manually after the uploads succeed). Guards live in
  # scripts/verify_consolidated_candidate.py and are tested in scripts/test_consolidated_candidate.py.
  validate_candidate_pin:
    name: Validate the candidate pin
    needs: validate_publication_selection
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_candidate_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts
            .github/release-pins
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fail before any download on an unknown version or a missing or malformed pin field
        env:
          VERSION: ${{ inputs.promote_candidate_version }}
        run: python3 scripts/verify_consolidated_candidate.py validate-pin --version "$VERSION"

  retrieve_candidate:
    name: Retrieve and verify the pinned candidate
    needs: validate_candidate_pin
    # No publisher secret or environment here; only the read-only token used to fetch the artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the reviewed repository and ref
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'elsa-workflows/elsa-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_TYPE" = 'branch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts
            .github/release-pins
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the verifier before trusting it
        run: python3 -B -m unittest scripts.test_consolidated_candidate
      - name: Fetch run, artifact and ancestry metadata and the artifact; verify run, artifact, source, ancestry and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.promote_candidate_version }}
        run: python3 scripts/verify_consolidated_candidate.py retrieve --version "$VERSION" --output "$RUNNER_TEMP/transport"
      - name: Transfer the verified bytes to the publish jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidated-candidate-transport
          path: ${{ runner.temp }}/transport
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  publish_candidate_feedz:
    name: Publish the pinned candidate to Feedz
    needs: retrieve_candidate
    # Keys on the target only, never on a version. Retrieval and every verification above it always run.
    if: ${{ inputs.promote_target == 'all' || inputs.promote_target == 'feedz' }}
    environment: feedz-publish
    # One feedz promotion per version at a time; a second dispatch waits instead of racing.
    concurrency:
      group: promote-candidate-feedz-${{ inputs.promote_candidate_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Keep the job timeout above the push action's deadline (see push-nuget-packages).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the reviewed repository and ref
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'elsa-workflows/elsa-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_TYPE" = 'branch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/actions
            .github/release-pins
            scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: consolidated-candidate-transport
          path: ${{ runner.temp }}/transport
      - name: Re-verify the pin (run, artifact, source, ancestry, archive, manifest and per-package seal hashes) and stage the sealed packages
        # Blank every GitHub token name, as the verifier refuses to run with one set.
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          ACTIONS_READ_TOKEN: ''
          VERSION: ${{ inputs.promote_candidate_version }}
        run: python3 scripts/verify_consolidated_candidate.py verify --version "$VERSION" --transport "$RUNNER_TEMP/transport" --stage "$GITHUB_WORKSPACE"
      - name: Guard the full ID set before Feedz
        env:
          PACKAGES_DIR: ${{ github.workspace }}
          VERSION: ${{ inputs.promote_candidate_version }}
        run: |
          set -euo pipefail
          python3 scripts/validate_packages_id_set.py
          python3 scripts/verify_consolidated_candidate.py count --version "$VERSION" --feed feedz --dir "$PACKAGES_DIR"
      - name: Publish the candidate to feedz.io
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.feedz_feed_source }}
          api-key: ${{ secrets.ELSA_CONSOLIDATED_FEEDZ_PUBLISH_KEY }}

  publish_candidate_nuget:
    name: Publish the pinned candidate to nuget.org
    # On 'all', nuget.org waits for Feedz and runs only if Feedz succeeded. On 'nuget', Feedz is skipped
    # and !cancelled() stops that skip from also skipping this job; the pin and retrieval must still succeed.
    needs: [validate_candidate_pin, retrieve_candidate, publish_candidate_feedz]
    if: ${{ !cancelled() && needs.validate_candidate_pin.result == 'success' && needs.retrieve_candidate.result == 'success' && (inputs.promote_target == 'all' || inputs.promote_target == 'nuget') && (needs.publish_candidate_feedz.result == 'success' || (inputs.promote_target == 'nuget' && needs.publish_candidate_feedz.result == 'skipped')) }}
    environment: nuget-org
    # One nuget promotion per version at a time; a second dispatch waits instead of racing.
    concurrency:
      group: promote-candidate-nuget-${{ inputs.promote_candidate_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Lets this job request the OIDC token that nuget.org exchanges for a temporary API key.
    steps:
      - name: Require the reviewed repository and ref
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'elsa-workflows/elsa-core'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_TYPE" = 'branch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/actions
            .github/release-pins
            scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: consolidated-candidate-transport
          path: ${{ runner.temp }}/transport
      - name: Re-verify the pin (run, artifact, source, ancestry, archive, manifest and per-package seal hashes) and stage the sealed packages
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          ACTIONS_READ_TOKEN: ''
          VERSION: ${{ inputs.promote_candidate_version }}
        run: python3 scripts/verify_consolidated_candidate.py verify --version "$VERSION" --transport "$RUNNER_TEMP/transport" --stage "$GITHUB_WORKSPACE"
      - name: Read the pinned exclusions
        id: pin
        env:
          VERSION: ${{ inputs.promote_candidate_version }}
        run: python3 scripts/verify_consolidated_candidate.py pin-output --version "$VERSION" --feed nuget >> "$GITHUB_OUTPUT"
      - name: Guard the ID set (pinned exclusions applied) before nuget.org
        env:
          PACKAGES_DIR: ${{ github.workspace }}
          EXCLUDE_IDS: ${{ steps.pin.outputs.exclude_ids }}
          VERSION: ${{ inputs.promote_candidate_version }}
        run: |
          set -euo pipefail
          python3 scripts/validate_packages_id_set.py
          python3 scripts/verify_consolidated_candidate.py count --version "$VERSION" --feed nuget --dir "$PACKAGES_DIR"
      # Exchanges a GitHub OIDC token for a temporary nuget.org API key. The Trusted Publishing policy on
      # nuget.org must name this workflow file (packages.yml).
      - name: NuGet login for the candidate (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), not an email address.
      - name: Publish the candidate to nuget.org
        uses: ./.github/actions/push-nuget-packages
        with:
          feed-source: ${{ env.nuget_feed_source }}
          api-key: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
