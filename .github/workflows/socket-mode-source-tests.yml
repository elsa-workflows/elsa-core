name: Offline Socket source tests

on:
  push:
    branches: ['codex/socket-ingress-integration-8666']
    paths:
      - 'src/**'
      - 'test/extensions/modules/slack/**'
      - 'test/integration/Elsa.Connections.Credentials.Persistence.PostgreSql.IntegrationTests/**'
      - 'test/integration/Directory.*'
      - 'test/workers/**'
      - '.github/workflows/socket-mode-source-tests.yml'
      - 'scripts/integration-program/*.py'
      - 'Directory.*'
      - 'src/Directory.*'
      - 'test/Directory.*'
      - 'test/extensions/Directory.*'
      - 'test/extensions/modules/Directory.*'
      - 'global.json'
      - 'NuGet.Config'
  pull_request:
    paths:
      - 'src/**'
      - 'test/extensions/modules/slack/**'
      - 'test/integration/Elsa.Connections.Credentials.Persistence.PostgreSql.IntegrationTests/**'
      - 'test/integration/Directory.*'
      - 'test/workers/**'
      - '.github/workflows/socket-mode-source-tests.yml'
      - 'scripts/integration-program/*.py'
      - 'Directory.*'
      - 'src/Directory.*'
      - 'test/Directory.*'
      - 'test/extensions/Directory.*'
      - 'test/extensions/modules/Directory.*'
      - 'global.json'
      - 'NuGet.Config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: slack-unit-loopback
            framework: net8.0
          - suite: slack-unit-loopback
            framework: net9.0
          - suite: slack-unit-loopback
            framework: net10.0
          - suite: postgres-socket
            framework: net10.0
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      FRAMEWORK: ${{ matrix.framework }}
      SUITE: ${{ matrix.suite }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Run selected source tests and verify aggregate evidence
        # The PostgreSQL cell uses the real shared Testcontainers fixture. It does not
        # establish package-only/full Socket acceptance or attest fixture cleanup.
        id: tests
        shell: bash
        run: |
          python3 scripts/integration-program/run_socket_source_tests.py \
            --suite "$SUITE" --framework "$FRAMEWORK" --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/socket-source" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain allowlisted aggregate or failure summary only
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: socket-source-${{ matrix.suite }}-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/socket-source/retained/receipt.json
            ${{ runner.temp }}/socket-source/retained/failure.json
          if-no-files-found: error
          retention-days: 14
