name: Consolidated package proof

on:
  pull_request:
    paths:
      - '.github/workflows/prove-consolidated-packages.yml'
      - 'scripts/integration-program/prove_consolidated*.py'
      - 'scripts/integration-program/test_prove_consolidated*.py'
      - 'scripts/integration-program/consolidated-package-consumer/**'
      - 'scripts/integration-program/VerifyPackageSymbolPair/**'
      - 'scripts/integration-program/build_studio_clientlibs.sh'
      - 'scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/**'
      - 'build/**'
      - 'src/**/*.csproj'
      - 'src/**/Directory.Build.*'
      - 'src/**/Directory.Packages.props'
      - 'Elsa.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'
      - 'icon.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check proof guards and negative artifact fixtures
        run: python3 -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
      - name: Produce and verify exact-head packages without publication
        env:
          PROOF_VERSION: 3.10.0-proof.${{ github.run_id }}.${{ github.run_attempt }}
          PROOF_OUTPUT: ${{ runner.temp }}/consolidated-proof
        run: |
          python3 scripts/integration-program/prove_consolidated_packages.py \
            --version "$PROOF_VERSION" --output "$PROOF_OUTPUT" --remote-sources
      - name: Retain artifact inventory, packages and proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidated-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consolidated-proof
          if-no-files-found: error
          retention-days: 7
