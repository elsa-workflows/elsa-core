# Scans npm lockfiles on main, release branches and weekly. Studio ClientLib reviewed
# lockfiles use non-standard names, so they are passed explicitly;
# recursive source scanning covers the rest. Directory.Packages.props
# coverage is out of scope here.
name: OSV-Scanner

on:
  push:
    branches:
      - main
      - 'release/*'
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        --lockfile=package-lock.json:scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/designer.package-lock.json
        --lockfile=package-lock.json:scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/dom-interop.package-lock.json
        --lockfile=package-lock.json:scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/bpmn-js.package-lock.json
        --lockfile=package-lock.json:scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/bpmn-shared.package-lock.json
        --lockfile=package-lock.json:scripts/integration-program/consolidated-build/studio-clientlib-lockfiles/bpmn-x6.package-lock.json
        ./
    permissions:
      actions: read
      contents: read
      security-events: write
