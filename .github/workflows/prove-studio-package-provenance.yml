name: Studio Core package provenance rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/prove-studio-package-provenance.yml'
      - 'src/studio/Directory.Build.props'
      - 'src/studio/Directory.Build.targets'
      - 'src/studio/Directory.Packages.props'
      - 'src/clients/Elsa.Api.Client/**'
      - 'src/studio/framework/Elsa.Studio.Core/**'
      - 'scripts/integration-program/verify_studio_package_provenance.py'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'icon.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-studio-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pack only Studio Core into a local proof directory
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-proof.${{ github.run_id }}.${{ github.run_attempt }}"
          dotnet pack src/studio/framework/Elsa.Studio.Core/Elsa.Studio.Core.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/studio-core-package" \
            -p:IsPackable=true \
            -p:ContinuousIntegrationBuild=true \
            -p:PackageVersion="$version"
      - name: Verify nuspec, icon, framework assets and SourceLink
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install sourcelink --version 3.1.1 --tool-path "$RUNNER_TEMP/sourcelink-tool"
          python3 scripts/integration-program/verify_studio_package_provenance.py \
            --package-dir "$RUNNER_TEMP/studio-core-package" \
            --version "0.0.0-proof.${{ github.run_id }}.${{ github.run_attempt }}" \
            --commit "$(git rev-parse HEAD)" \
            --sourcelink-tool "$RUNNER_TEMP/sourcelink-tool/sourcelink" \
            | tee "$RUNNER_TEMP/studio-core-provenance.json"
      - name: Retain local proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-core-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-core-package/*.nupkg
            ${{ runner.temp }}/studio-core-package/*.snupkg
            ${{ runner.temp }}/studio-core-provenance.json
          if-no-files-found: error
          retention-days: 7
