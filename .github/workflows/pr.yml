name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: CI suite to run
        required: true
        default: compile
        type: choice
        options:
          - compile
          - product-entrypoints
          - docker-smoke
          - admission-proof
          - execution-cycle-proof
          - dapper-providers
          - mongo-atomic-proof
          - integration-tools
          - current-import-impact
          - package-impact-closure
          - consolidated-package-proof
          - studio-package-provenance
          - slack-package-proof
          - product-release-plan
          - studio-clientlibs
          - react-studio
          - apps
          - templates
          - persisted-upgrade
      include_docker:
        description: Run the Testcontainers projects in package-impact-closure
        type: boolean
        default: true
      product:
        description: Product for product-release-plan
        type: choice
        options: [core, studio, extensions]
      line:
        description: Line for product-release-plan
        type: choice
        options: ['3.8', '3.9', '3.10']
      version:
        description: Hypothetical version for product-release-plan
        type: string

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        env:
          CI_SUITE: ${{ inputs.suite }}
        run: |
          python3 -m unittest discover -s scripts/ci
          python3 scripts/ci/select_pr_suites.py

  # Which .NET projects this change affects, so ubuntu-latest builds and tests only those.
  # https://stenbrinke.nl/blog/build-only-what-changed-in-your-dotnet-monorepo/
  affected:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['compile'] }}
    name: Select affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to find this workflow's last verified push run on a branch
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.x
      - run: dotnet tool restore
      # Only this step gets the token, so the PR's MSBuild evaluation never sees it.
      - name: Find the commit to compare with
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/select_affected_projects.py base >> "$GITHUB_OUTPUT"
      - name: Decide what to build
        id: decide
        shell: bash # -eo pipefail, so a script failure fails the step
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: python3 scripts/ci/select_affected_projects.py decide | tee -a "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
      - name: Upload the affected solution
        if: steps.decide.outputs.build == 'affected'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: affected-solution
          path: affected.slnx
          if-no-files-found: error
          retention-days: 7

  # .NET solution build and tests: everything, only the affected projects, or nothing
  ubuntu-latest:
    needs: [changes, affected]
    if: ${{ fromJSON(needs.changes.outputs.suites)['compile'] && needs.affected.outputs.build != 'none' }}
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.x
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the affected solution
        if: needs.affected.outputs.build == 'affected'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: affected-solution
      - name: 'Run: Compile, Test'
        env:
          SOLUTION: ${{ needs.affected.outputs.build == 'affected' && 'affected.slnx' || 'Elsa.sln' }}
        run: ./build.cmd Compile Test --solution "$SOLUTION"
      - name: Upload test results and hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-hang-dumps
          if-no-files-found: ignore
          path: |
            testresults/
            **/*.dmp
            **/*Sequence*.xml

  # ADR index
  check-toc:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['adr-index'] }}
    name: docs/adr/toc.md is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the generated index
        run: ./scripts/adr/generate-toc.sh --check

  # Solution groups
  check:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['solution-groups'] }}
    name: Solution grouping and filters are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the grouping
        run: |
          python3 -m unittest discover -s scripts/solution -p 'test_*.py'
          python3 scripts/solution/solution_groups.py --check

  # Product development entrypoints
  build-product-filters:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['product-entrypoints'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build reviewed Studio ClientLibs
        run: scripts/integration-program/build_studio_clientlibs.sh .
      - name: Build Core development entrypoint
        run: dotnet build Elsa.Core.slnf
      - name: Build Extensions development entrypoint
        run: dotnet build Elsa.Extensions.slnf
      - name: Build Studio development entrypoint
        run: dotnet build Elsa.Studio.slnf
      - name: Verify source remained unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
      - name: Record completed nonpublishing build scope
        run: |
          printf '{"sourceRevision":"%s","sourceTree":"%s","filters":["Elsa.Core.slnf","Elsa.Extensions.slnf","Elsa.Studio.slnf"],"frameworkPolicy":"project-defaults","published":false,"ideBreakpointsVerified":false,"appsReleaseAccepted":false}\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/product-entrypoints.json"
      - name: Retain build scope receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-entrypoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-entrypoints.json
          if-no-files-found: error
          retention-days: 14

  # Validate package publication gates
  validate-gates:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['package-gates'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned workflow parser
        # PyYAML 6.0.3, CPython 3.12 manylinux x86_64 wheel.
        run: |
          echo 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/gate-requirements.txt"
          python3 -m pip install --only-binary :all: --require-hashes -r "$RUNNER_TEMP/gate-requirements.txt"
      - run: python3 -B scripts/validate_packages_workflow_gates.py
      - name: Test the gate validator and the dispatch selection check
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_validate_packages_*.py'
          python3 -B -O -m unittest discover -s scripts -p 'test_validate_packages_*.py'
          python3 -B -m unittest scripts.test_stage_consolidated_candidate_nupkgs
          python3 -B -O -m unittest scripts.test_stage_consolidated_candidate_nupkgs
          python3 -B -m unittest scripts.test_consolidated_candidate
          python3 -B -O -m unittest scripts.test_consolidated_candidate
          python3 -B -m unittest scripts.test_nuget_release_evidence
          python3 -B -O -m unittest scripts.test_nuget_release_evidence
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify framework-specific release SBOM generation
        working-directory: scripts/release-evidence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test package-boms.test.mjs
      - name: Test isolated candidate preparation and original archive contracts
        run: |
          python3 -B -m unittest discover -s scripts/integration-program -p 'test_prepare_consolidated_release_candidate.py'
          python3 -B -O -m unittest discover -s scripts/integration-program -p 'test_prepare_consolidated_release_candidate.py'
          python3 -B -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
          python3 -B -O -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
      - name: Verify maintenance release train and candidate-only rejection
        run: |
          python3 -B -m unittest discover -s .agents/skills/elsa-release/tests -p 'test_release_train.py'
          python3 -B -O -m unittest discover -s .agents/skills/elsa-release/tests -p 'test_release_train.py'

  # Docker certificate smoke tests
  smoke:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['docker-smoke'] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elsa-server
            dockerfile: docker/ElsaServer.Dockerfile
            image: elsa-server-smoke
            skip_otel: '0'
          - name: elsa-server-and-studio
            dockerfile: docker/ElsaServerAndStudio.Dockerfile
            image: elsa-server-and-studio-smoke
            skip_otel: '0'
          - name: elsa-studio
            dockerfile: docker/ElsaStudio.Dockerfile
            image: elsa-studio-smoke
            skip_otel: '0'
          - name: elsa-server-datadog
            dockerfile: docker/ElsaServer-Datadog.Dockerfile
            image: elsa-server-datadog-smoke
            skip_otel: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish TLS smoke test app
        run: dotnet publish core/test/TlsSmoke/TlsSmoke.csproj -c Release -o artifacts/tls-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: Require the Studio image command to be the Studio host
        if: matrix.name == 'elsa-studio'
        run: |
          set -euo pipefail
          cmd="$(docker inspect -f '{{json .Config.Cmd}}' "${{ matrix.image }}")"
          echo "$cmd"
          test "$cmd" = '["dotnet","Elsa.Studio.Host.Server.dll"]'

      - name: Require the Studio image to serve ClientLib assets
        if: matrix.name == 'elsa-studio'
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HTTP_PORTS=8080 \
            -e Backend__Url=http://elsa-server:8080/elsa/api \
            -p 18080:8080 \
            "${{ matrix.image }}")"
          # On failure, print the container log before removing the container.
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs "$cid" || true; fi; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18080/_content/Elsa.Studio.Workflows.Designer/designer.css" -o /tmp/studio-designer.css; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          test -s /tmp/studio-designer.css
          curl -fsS "http://127.0.0.1:18080/_content/Elsa.Studio.Workflows.Designer/designer.entry.js" -o /tmp/studio-designer.entry.js
          test -s /tmp/studio-designer.entry.js
          curl -fsS "http://127.0.0.1:18080/_content/Elsa.Studio.DomInterop/dom.entry.js" -o /tmp/studio-dom.entry.js
          test -s /tmp/studio-dom.entry.js
          curl -fsS "http://127.0.0.1:18080/" -o /tmp/studio-index.html
          grep -F -q '_content/Elsa.Studio.Workflows.Designer/designer.css' /tmp/studio-index.html

      - name: Run TLS smoke tests
        env:
          SKIP_OTEL: ${{ matrix.skip_otel }}
        run: |
          set -euo pipefail
          TLS_APP_DIR="${{ github.workspace }}/artifacts/tls-smoke"
          if [ "$SKIP_OTEL" = "1" ]; then
            scripts/test-ca-trust.sh "${{ matrix.image }}" "$TLS_APP_DIR" -e ELSA_SKIP_OTEL_AUTO=1
          else
            scripts/test-ca-trust.sh "${{ matrix.image }}" "$TLS_APP_DIR"
          fi

  # Offline admission proof
  admission-proof:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['admission-proof'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Check fail-closed evidence contracts
        run: |
          python -m unittest discover -s scripts/integration-program -p test_admission_proof.py
          python -O -m unittest discover -s scripts/integration-program -p test_admission_proof.py
      - name: Compile fixtures, run offline cases and build production serially
        run: |
          python scripts/integration-program/run_admission_proof.py \
            --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/admission-proof"
      - name: Validate retained evidence boundary
        id: retained
        if: always()
        run: |
          python scripts/integration-program/run_admission_proof.py --validate-retained \
            --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/admission-proof/retained"
      - name: Retain sanitized receipt only
        if: always() && steps.retained.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admission-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission-proof/retained/receipt.json
          if-no-files-found: error
          retention-days: 14

  # Execution-cycle ownership proof
  execution-cycle-proof:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['execution-cycle-proof'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Check evidence policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p test_execution_cycle_proof.py
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p test_execution_cycle_proof.py
      - name: Build supported frameworks and verify execution ownership serially
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/integration-program/run_execution_cycle_proof.py \
            --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/execution-cycle-proof"
      - name: Retain sanitized case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-cycle-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/execution-cycle-proof/receipt.json
          if-no-files-found: error
          retention-days: 14

  # Dapper provider tests
  store-tests:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['dapper-providers'] }}
    env:
      PROJECT: extensions/test/modules/persistence/Elsa.Persistence.Dapper.UnitTests/Elsa.Persistence.Dapper.UnitTests.csproj
      FILTER: FullyQualifiedName~DapperWorkflowDefinitionStoreTests|FullyQualifiedName~DapperStoreTenantUpsertTests|FullyQualifiedName~DapperSharedWorkflowStartupTests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 17.11
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: elsa
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: elsa_dapper
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U elsa -d elsa_dapper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        # 2022 RTM-CU27 16.0.4295.3
        image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-{1}x', github.run_id, github.run_attempt) }}
        ports:
          - 127.0.0.1:1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - id: build
        name: Build
        run: dotnet build "$PROJECT" -f net10.0
      # TreatNoTestsAsError fails the step if a rename leaves the filter matching nothing.
      - name: PostgreSQL
        env:
          ELSA_DAPPER_CAS_PROVIDER: postgres
          ELSA_DAPPER_CAS_CONNECTION: Host=127.0.0.1;Port=5432;Database=elsa_dapper;Username=elsa
        run: dotnet test "$PROJECT" -f net10.0 --no-build --filter "$FILTER" -- RunConfiguration.TreatNoTestsAsError=true
      - name: SQL Server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ELSA_DAPPER_CAS_PROVIDER: sqlserver
          ELSA_DAPPER_CAS_CONNECTION: Server=127.0.0.1,1433;User Id=sa;Password=${{ format('Ci-{0}-{1}x', github.run_id, github.run_attempt) }};TrustServerCertificate=True;Command Timeout=15
        run: dotnet test "$PROJECT" -f net10.0 --no-build --filter "$FILTER" -- RunConfiguration.TreatNoTestsAsError=true

  # Mongo atomic-update proof
  mongo-atomic-proof:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['mongo-atomic-proof'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Verify evidence policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p test_mongo_atomic_proof.py
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p test_mongo_atomic_proof.py
      - name: Prove baseline regressions and corrected Mongo behavior
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/integration-program/run_mongo_atomic_proof.py \
            --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/mongo-atomic-proof"
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mongo-atomic-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mongo-atomic-proof/receipt.json
          if-no-files-found: error
          retention-days: 14

  # Integration program tools
  retained-testing-helper:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['integration-tools'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Restore and build the retained helper on every supported framework
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          project = Path('extensions/src/Elsa.Testing.Extensions/Elsa.Testing.Extensions.csproj')
          package = 'Microsoft.AspNetCore.Mvc.Testing'
          for framework in ('net8.0', 'net9.0', 'net10.0'):
              subprocess.run([
                  'dotnet', 'build', str(project), '--configuration', 'Release',
                  '--framework', framework, '--nologo', '-m:1',
              ], check=True)
              evaluation = json.loads(subprocess.check_output([
                  'dotnet', 'msbuild', str(project), '-nologo',
                  f'-p:TargetFramework={framework}',
                  '-getProperty:ManagePackageVersionsCentrally',
                  '-getItem:PackageVersion,PackageReference',
              ], text=True))
              references = [item for item in evaluation['Items']['PackageReference']
                            if item['Identity'] == package]
              if (evaluation['Properties']['ManagePackageVersionsCentrally'].lower() != 'true'
                      or len(references) != 1 or references[0].get('Version')
                      or references[0].get('VersionOverride')):
                  raise SystemExit(f'{framework}: MVC.Testing must use central package management')
              versions = [item['Version'] for item in evaluation['Items']['PackageVersion']
                          if item['Identity'] == package]
              assets = json.loads((project.parent / 'obj/project.assets.json').read_text())
              resolved = [identity for identity in assets['targets'][framework]
                          if identity.startswith(f'{package}/')]
              if len(versions) != 1 or resolved != [f'{package}/{versions[0]}']:
                  raise SystemExit(f'{framework}: resolved MVC.Testing differs from central policy')
              print(f'{framework}: built with MVC.Testing {versions[0]}', flush=True)
          PY

  import-rehearsal-tests:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['integration-tools'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The bridge verifies an older pinned Core commit with git cat-file and git diff.
          fetch-depth: 0
      - name: Verify Dependabot project discovery coverage
        # Ubuntu's Ruby includes Minitest as a bundled gem; retain a pinned fallback.
        run: |
          ruby -e 'require "minitest"' || gem install --user-install --no-document minitest --version 5.16.3
          ruby scripts/integration-program/test_dependabot_discovery.rb
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # Symbol-pair tests and the pinned Secrets lockfiles use this SDK.
          dotnet-version: '10.0.300'
      - name: Install the pinned workflow parser
        # The r7 source-tip receipt test shells out to scripts/validate_packages_workflow_gates.py, which needs this.
        # PyYAML 6.0.3, CPython 3.12 manylinux x86_64 wheel.
        run: |
          echo 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/gate-requirements.txt"
          python3 -m pip install --only-binary :all: --require-hashes -r "$RUNNER_TEMP/gate-requirements.txt"
      - name: Verify the real symbol inspector against compiler-produced DLL and PDB fixtures
        env:
          ELSA_SYMBOL_INSPECTOR_DLL: ${{ runner.temp }}/symbol-inspector-fixture/VerifyPackageSymbolPair.dll
        run: |
          dotnet build scripts/integration-program/VerifyPackageSymbolPair/VerifyPackageSymbolPair.csproj \
            --configuration Release --output "$RUNNER_TEMP/symbol-inspector-fixture"
          python -m unittest discover -s scripts/integration-program -p test_verify_package_symbol_pair.py
          python -O -m unittest discover -s scripts/integration-program -p test_verify_package_symbol_pair.py
      - name: Verify program graph, import safety and history preservation
        run: |
          python docs/integration-program/verify-hierarchy.py
          python -m unittest discover -s scripts/integration-program -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_*.py'
      - name: Preserve maintenance package verification and recovery contracts
        working-directory: .agents/skills/elsa-release/tests
        run: |
          python -m unittest test_verify_packages test_release_train
          python -O -m unittest test_verify_packages test_release_train
      - name: Verify activity contract comparison guards
        run: |
          python -m unittest discover -s scripts/integration-program/activity-compatibility -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program/activity-compatibility -p 'test_*.py'
      - name: Verify synthetic Secrets SQLite bridge against current Core
        run: |
          python scripts/integration-program/run_secrets_sqlite_bridge_contract.py \
            --report-out "$RUNNER_TEMP/secrets-sqlite-bridge-report.json"
      - name: Characterize published Secrets PostgreSQL upgrade and rollback
        run: |
          python scripts/integration-program/run_secrets_postgresql_upgrade_fixture.py \
            --report-out "$RUNNER_TEMP/secrets-postgresql-upgrade-report.json"
          diff -u scripts/integration-program/secrets-postgresql-upgrade/observed-result.json \
            "$RUNNER_TEMP/secrets-postgresql-upgrade-report.json"
      - name: Prove synthetic PostgreSQL Secrets fresh-destination bridge
        run: |
          python scripts/integration-program/run_secrets_postgresql_bridge.py \
            --report-out "$RUNNER_TEMP/secrets-postgresql-bridge-report.json"
      - name: Retain redacted PostgreSQL bridge report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-postgresql-bridge-report
          path: ${{ runner.temp }}/secrets-postgresql-bridge-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Characterize published Secrets SQL Server upgrade failure
        run: |
          python scripts/integration-program/run_secrets_sqlserver_upgrade_fixture.py \
            --report-out "$RUNNER_TEMP/secrets-sqlserver-upgrade-report.json"
          diff -u scripts/integration-program/secrets-sqlserver-upgrade/observed-result.json \
            "$RUNNER_TEMP/secrets-sqlserver-upgrade-report.json"
      - name: Verify synthetic Secrets SQL Server fresh-destination bridge
        run: |
          python scripts/integration-program/run_secrets_sqlserver_bridge.py \
            --report-out "$RUNNER_TEMP/secrets-sqlserver-bridge-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-sqlserver-bridge-report
          path: ${{ runner.temp }}/secrets-sqlserver-bridge-report.json
          if-no-files-found: error
          retention-days: 30

  # Current imported-source test impact
  select-tests:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['current-import-impact'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test selection policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p 'test_current_import_impact.py'
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p 'test_current_import_impact.py'
      - name: Restore and select from this exact source revision
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/integration-program/current_import_impact.py \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/current-import-impact.json"
      - name: Upload nonpublishing selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-import-impact
          path: ${{ runner.temp }}/current-import-impact.json
          if-no-files-found: warn
          retention-days: 14

  run-affected-tests:
    needs: [changes, select-tests]
    if: ${{ fromJSON(needs.changes.outputs.suites)['current-import-impact'] && (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test affected-test runner policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/integration-program -p 'test_run_current_import_affected_tests.py'
          PYTHONDONTWRITEBYTECODE=1 python -O -m unittest discover -s scripts/integration-program -p 'test_run_current_import_affected_tests.py'
      - name: Restore and select affected tests on this runner
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/integration-program/current_import_impact.py \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/current-import-impact.json"
      - name: Execute selected tests without package publication
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/integration-program/run_current_import_affected_tests.py \
            --selection "$RUNNER_TEMP/current-import-impact.json" \
            --output-dir "$RUNNER_TEMP/current-import-test-execution" \
            --expected-head "$EXPECTED_HEAD"
      - name: Upload sanitized execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-import-affected-tests
          path: |
            ${{ runner.temp }}/current-import-impact.json
            ${{ runner.temp }}/current-import-test-execution/receipt.json
          if-no-files-found: warn
          retention-days: 14

  # Package impact closure rehearsal
  selector-and-plan:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['package-impact-closure'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # The import receipt tests verify ancestors and mapped blobs at pinned commits.
          fetch-depth: 0
      - name: Record and verify the exact proof-code commit
        env:
          EXPECTED_PROOF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_PROOF_SHA" ]; then
            echo "Expected proof-code commit $EXPECTED_PROOF_SHA, checked out $actual" >&2
            exit 1
          fi
          printf '{"proof_code_commit":"%s","publication_performed":false}\n' "$actual" > "$RUNNER_TEMP/selector-run-context.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned workflow parser
        # The r7 source-tip receipt test shells out to scripts/validate_packages_workflow_gates.py, which needs this.
        # PyYAML 6.0.3, CPython 3.12 manylinux x86_64 wheel.
        run: |
          echo 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/gate-requirements.txt"
          python3 -m pip install --only-binary :all: --require-hashes -r "$RUNNER_TEMP/gate-requirements.txt"
      - name: Test selector and closure classification
        run: |
          python -m unittest discover -s scripts/integration-program -p 'test_*.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_*.py'
      - name: Validate current publisher ownership without cutover
        run: |
          python scripts/integration-program/check_publisher_handoff.py \
            --manifest docs/integration-program/release-units.json
      - name: Rehearse the Core-to-Slack dependency selection
        run: >-
          python scripts/integration-program/package_closure.py
          --inventory docs/integration-program/inventory/inventory.json
          --output "${RUNNER_TEMP}/package-closure-plan.json"
      - name: Require the paired release-unit and shared-Core selectors
        run: |
          python - "${RUNNER_TEMP}/package-closure-plan.json" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = plan["paired_selector_assertions"]
          if receipt["status"] != "passed":
              raise SystemExit(f"Paired selector assertions did not pass: {receipt}")
          slack_only = receipt["slack_only_change"]
          shared_core = receipt["shared_core_change"]
          if slack_only["package_ids_to_pack"] != ["Elsa.Slack"]:
              raise SystemExit(f"Slack-only change selected unexpected packages: {slack_only}")
          if not slack_only["test_projects_match_manifest"] or not slack_only["only_release_unit_package_selected"]:
              raise SystemExit(f"Slack-only selector differs from its manifest: {slack_only}")
          if shared_core["package_ids_to_pack"] != ["Elsa.Slack"]:
              raise SystemExit(f"Shared-Core test-impact scenario selected unexpected unit packages: {shared_core}")
          if not shared_core["release_unit_tests_in_closure"] or not shared_core["test_closure_expanded"]:
              raise SystemExit(f"Shared-Core change did not expand the selected test closure: {shared_core}")
          if receipt["unchanged_package_control"]["selected_for_pack"]:
              raise SystemExit(f"Unchanged connector was selected for packing: {receipt}")
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paired-release-unit-selector-receipt
          path: |
            ${{ runner.temp }}/package-closure-plan.json
            ${{ runner.temp }}/selector-run-context.json

  pinned-source-tests:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['package-impact-closure'] && (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read source pins from the inventory
        id: pins
        run: >-
          python scripts/integration-program/package_closure.py
          --inventory docs/integration-program/inventory/inventory.json
          --github-output "$GITHUB_OUTPUT"
          --output "${RUNNER_TEMP}/source-pins-plan.json"
      - name: Checkout pinned Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.pins.outputs.core }}
          path: sources/elsa-core
          persist-credentials: false
      - name: Checkout pinned Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.pins.outputs.extensions }}
          path: sources/elsa-extensions
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Execute the pinned dependency closure
        run: |
          python scripts/integration-program/source_bindings.py \
            --inventory docs/integration-program/inventory/inventory.json \
            --core sources/elsa-core \
            --extensions sources/elsa-extensions \
            --overlay sources/source-bound-extensions \
            --receipt "${RUNNER_TEMP}/source-binding.json"
          args=()
          if [ "${{ inputs.include_docker }}" = "true" ]; then
            args+=(--include-docker)
          fi
          python scripts/integration-program/package_closure.py \
            --inventory docs/integration-program/inventory/inventory.json \
            --source elsa-core=sources/elsa-core \
            --source elsa-extensions=sources/source-bound-extensions \
            --source-binding-receipt "${RUNNER_TEMP}/source-binding.json" \
            --run "${args[@]}" \
            --output "${RUNNER_TEMP}/package-closure.json"
      - name: Upload source, TRX, and build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-closure-source-test-receipts
          path: |
            ${{ runner.temp }}/source-pins-plan.json
            ${{ runner.temp }}/source-binding.json
            ${{ runner.temp }}/package-closure.json
            ${{ runner.temp }}/artifacts/**
          if-no-files-found: warn

  released-artifact-proof:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['package-impact-closure'] && (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assert the runner targets the released 3.8.4 source pins
        id: release-pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          sys.path.insert(0, "scripts/integration-program")
          import run_slack_package_proof as proof

          expected = {
              "core": "33181ae3048f628f591a0155b5665a8e4d1bcea2",
              "extensions": "154ba15fb4da85b4bebecfbe43639579cbda1d0d",
          }
          actual = {"core": proof.CORE_SHA, "extensions": proof.EXTENSIONS_SHA}
          for name, pin in expected.items():
              if not re.fullmatch(r"[0-9a-f]{40}", pin) or actual[name] != pin:
                  raise SystemExit(f"Proof runner {name} pin {actual[name]!r} differs from released 3.8.4 pin {pin!r}")
              print(f"{name}={pin}")
          PY
      - name: Checkout released Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.release-pins.outputs.core }}
          path: sources/elsa-core
          persist-credentials: false
      - name: Checkout released Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.release-pins.outputs.extensions }}
          path: sources/elsa-extensions
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install isolated SourceLink 3.1.1 tool
        run: |
          tool_root="${RUNNER_TEMP}/sourcelink"
          mkdir -p "$tool_root"
          cat > "$tool_root/NuGet.Config" <<'EOF'
          <configuration><packageSources><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          EOF
          dotnet tool install --tool-path "$tool_root" sourcelink --version 3.1.1 --configfile "$tool_root/NuGet.Config"
      - name: Run local-only released artifact and clean consumer proof
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/run_slack_package_proof.py \
            --core-source sources/elsa-core \
            --extensions-source sources/elsa-extensions \
            --output-dir "$PROOF_OUTPUT" \
            --sourcelink-tool "${RUNNER_TEMP}/sourcelink/sourcelink"
      - name: Upload proof receipts, logs, and generated consumer inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-released-artifact-proof-evidence
          path: |
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/impact-selection.json
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/logs/**
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/test-results/**/*.trx
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.cs
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.csproj
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/NuGet.Config
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/source-link/*.pdb
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/NuGet.Config
            ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/Source-NuGet.Config
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the local released-source proof package only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-local-proof-nupkg
          path: ${{ runner.temp }}/elsa-slack-proof-${{ github.run_id }}-${{ github.run_attempt }}/local-feed/Elsa.Slack.3.8.5-proof.154ba15.nupkg
          if-no-files-found: warn
          retention-days: 14

  mapped-source-artifact-proof:
    needs: [changes, selector-and-plan]
    if: >-
      ${{ always() && needs.changes.result == 'success' &&
          fromJSON(needs.changes.outputs.suites)['package-impact-closure'] &&
          (github.event_name == 'workflow_dispatch' || needs.selector-and-plan.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify the exact proof-code commit
        env:
          EXPECTED_PROOF_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_PROOF_SHA" ]; then
            echo "Expected proof-code commit $EXPECTED_PROOF_SHA, checked out $actual" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/proof-run-context.json" "$actual" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "proof_code_commit": sys.argv[2],
              "proof_workflow": "Package impact closure rehearsal",
              "publication_performed": False,
              "proof_version_publishable": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the pinned integration source commits
        id: source-pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          sys.path.insert(0, "scripts/integration-program")
          import run_mapped_slack_package_proof as proof

          for name, commit in proof.SOURCE_COMMITS.items():
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"Invalid {name} source commit: {commit!r}")
              print(f"{name}={commit}")
          print(f"package_id={proof.PACKAGE_ID}")
          print(f"package_version={proof.PACKAGE_VERSION}")
          PY
      - name: Checkout pinned Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-core
          ref: ${{ steps.source-pins.outputs.core }}
          path: sources/elsa-core
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Extensions source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-extensions
          ref: ${{ steps.source-pins.outputs.extensions }}
          path: sources/elsa-extensions
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elsa-workflows/elsa-studio
          ref: ${{ steps.source-pins.outputs.studio }}
          path: sources/elsa-studio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Prepare a disposable history-mapped Slack source tree
        env:
          REHEARSAL: ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/rehearse-import.py \
            --core sources/elsa-core \
            --extensions sources/elsa-extensions \
            --studio sources/elsa-studio \
            --output "$REHEARSAL"
          git -C "$REHEARSAL" -c advice.detachedHead=false switch --quiet --detach rehearsal
          git -C "$REHEARSAL" reset --hard --quiet HEAD
          python scripts/integration-program/prepare_consolidated_build.py --rehearsal "$REHEARSAL"
      - name: Pack and verify mapped Slack locally
        env:
          REHEARSAL: ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/integration-program/run_mapped_slack_package_proof.py \
            --rehearsal "$REHEARSAL" \
            --core-source sources/elsa-core \
            --extensions-source sources/elsa-extensions \
            --studio-source sources/elsa-studio \
            --output-dir "$PROOF_OUTPUT"
      - name: Recheck exact local package provenance from retained consumer outputs
        if: success()
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
          RECHECK_RECEIPT: ${{ runner.temp }}/elsa-slack-consumer-provenance-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python scripts/integration-program/verify_mapped_slack_consumer_provenance.py \
            --evidence "$PROOF_OUTPUT/evidence.json" \
            --output "$RECHECK_RECEIPT"
      - name: Bundle portable mapped Slack provenance inputs
        if: success()
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
          PORTABLE_BUNDLE: ${{ runner.temp }}/elsa-slack-portable-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
        run: |
          python scripts/integration-program/create_mapped_slack_portable_bundle.py \
            --evidence "$PROOF_OUTPUT/evidence.json" \
            --output "$PORTABLE_BUNDLE"
      - name: Recheck the extracted portable bundle
        if: success()
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}
          PORTABLE_BUNDLE: ${{ runner.temp }}/elsa-slack-portable-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
        run: |
          extracted="$(mktemp -d)"
          tar -xzf "$PORTABLE_BUNDLE" -C "$extracted"
          python scripts/integration-program/verify_mapped_slack_consumer_provenance.py \
            --evidence "$extracted/evidence.json" \
            --output "$PROOF_OUTPUT/portable-recheck.json"
      - name: Upload portable mapped Slack provenance bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-mapped-portable-provenance
          path: ${{ runner.temp }}/elsa-slack-portable-proof-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Upload mapped-source proof receipts, logs, and consumer inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-mapped-source-proof-evidence
          path: |
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
            ${{ runner.temp }}/proof-run-context.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/current-source-impact-selection.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/logs/**
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/test-results/**/*.trx
            ${{ runner.temp }}/elsa-slack-consumer-provenance-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.cs
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/*.csproj
            ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/consumers/**/NuGet.Config
            ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}/import-receipt.json
            ${{ runner.temp }}/elsa-slack-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}/consolidated-build-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the local mapped-source package only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-mapped-local-proof-nupkg
          path: ${{ runner.temp }}/elsa-slack-mapped-proof-${{ github.run_id }}-${{ github.run_attempt }}/local-feed/${{ steps.source-pins.outputs.package_id }}.${{ steps.source-pins.outputs.package_version }}.nupkg
          if-no-files-found: warn
          retention-days: 14

  # Consolidated package proof
  prove:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['consolidated-package-proof'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          # The verifier links the selected SDK's NuGet assemblies and targets .NET 10.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-10
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.300
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check proof guards and negative artifact fixtures
        run: python3 -m unittest discover -s scripts/integration-program -p 'test_prove_consolidated*.py'
      - name: Produce and verify exact-head packages without publication
        env:
          PROOF_VERSION: 3.10.0-proof.${{ github.run_id }}.${{ github.run_attempt }}
          PROOF_OUTPUT: ${{ runner.temp }}/consolidated-proof
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 scripts/integration-program/prove_consolidated_packages.py \
            --version "$PROOF_VERSION" --output "$PROOF_OUTPUT" --remote-sources
      - name: Retain artifact inventory, packages and proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidated-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consolidated-proof
          if-no-files-found: error
          retention-days: 7

  # Studio Core package provenance rehearsal
  pack-studio-core:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['studio-package-provenance'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pack only Studio Core into a local proof directory
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-proof.${{ github.run_id }}.${{ github.run_attempt }}"
          dotnet pack studio/src/framework/Elsa.Studio.Core/Elsa.Studio.Core.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/studio-core-package" \
            -p:IsPackable=true \
            -p:ContinuousIntegrationBuild=true \
            -p:PackageVersion="$version"
      - name: Verify nuspec, icon, framework assets and SourceLink
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install sourcelink --version 3.1.1 --tool-path "$RUNNER_TEMP/sourcelink-tool"
          python3 scripts/integration-program/verify_studio_package_provenance.py \
            --package-dir "$RUNNER_TEMP/studio-core-package" \
            --version "0.0.0-proof.${{ github.run_id }}.${{ github.run_attempt }}" \
            --commit "$(git rev-parse HEAD)" \
            --sourcelink-tool "$RUNNER_TEMP/sourcelink-tool/sourcelink" \
            | tee "$RUNNER_TEMP/studio-core-provenance.json"
      - name: Retain local proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-core-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-core-package/*.nupkg
            ${{ runner.temp }}/studio-core-package/*.snupkg
            ${{ runner.temp }}/studio-core-provenance.json
          if-no-files-found: error
          retention-days: 7

  # Elsa.Slack release-unit artifact rehearsal
  pack-slack-only:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['slack-package-proof'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Read the reviewed Elsa package baseline
        id: dependency
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          manifest = json.load(open('docs/integration-program/release-units.json', encoding='utf-8'))
          units = [unit for unit in manifest['release_units'] if unit['package_id'] == 'Elsa.Slack']
          if len(units) != 1:
              raise SystemExit(f'Expected one Elsa.Slack release unit, got {len(units)}')
          dependencies = {item['package_id']: item['version']
                          for item in units[0]['tested_artifact_dependencies']}
          if set(dependencies) != {'Elsa', 'SlackNet'}:
              raise SystemExit(f'Unexpected tested dependencies: {dependencies}')
          print(f"elsa_version={dependencies['Elsa']}")
          print(f"slacknet_version={dependencies['SlackNet']}")
          print(f"proof_base_version={units[0]['versioning']['local_proof_version']}")
          PY
      - name: Pack only Elsa.Slack with a proof version
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          ELSA_VERSION: ${{ steps.dependency.outputs.elsa_version }}
          SLACKNET_VERSION: ${{ steps.dependency.outputs.slacknet_version }}
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/slack-artifacts"
          cat > "$RUNNER_TEMP/Slack-NuGet.Config" <<'EOF'
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet restore extensions/src/communication/Elsa.Slack/Elsa.Slack.csproj \
            --configfile "$RUNNER_TEMP/Slack-NuGet.Config" \
            -p:UseProjectReferences=false \
            -p:ElsaVersion="$ELSA_VERSION"
          dotnet pack extensions/src/communication/Elsa.Slack/Elsa.Slack.csproj \
            --configuration Release \
            --no-restore \
            --output "$RUNNER_TEMP/slack-artifacts" \
            -p:IsPackable=true \
            -p:UseProjectReferences=false \
            -p:ElsaVersion="$ELSA_VERSION" \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:PackageProjectUrl=https://github.com/elsa-workflows/elsa-core \
            -p:RepositoryUrl=https://github.com/elsa-workflows/elsa-core \
            -p:ContinuousIntegrationBuild=true
          python3 - "$RUNNER_TEMP/slack-artifacts" "$PACKAGE_VERSION" "$ELSA_VERSION" "$SLACKNET_VERSION" "$EXPECTED_SOURCE_SHA" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          directory, version, elsa_version, slacknet_version, source_sha = (
              Path(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          )
          expected = f"Elsa.Slack.{version}"
          actual = sorted(path.name for path in directory.iterdir() if path.is_file())
          if actual != [f"{expected}.nupkg", f"{expected}.snupkg"]:
              raise SystemExit(f"Expected only Elsa.Slack artifacts, got {actual}")
          frameworks = ("net8.0", "net9.0", "net10.0")
          with ZipFile(directory / f"{expected}.nupkg") as package:
              names = [name for name in package.namelist() if name.endswith(".nuspec")]
              if len(names) != 1:
                  raise SystemExit(f"Expected one nuspec, got {names}")
              root = ET.fromstring(package.read(names[0]))
              namespace = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
              package_id = root.findtext("n:metadata/n:id", namespaces=namespace)
              package_version = root.findtext("n:metadata/n:version", namespaces=namespace)
              if (package_id, package_version) != ("Elsa.Slack", version):
                  raise SystemExit(f"Unexpected nuspec identity: {package_id} {package_version}")
              project_url = root.findtext("n:metadata/n:projectUrl", namespaces=namespace)
              repository = root.find("n:metadata/n:repository", namespaces=namespace)
              url = "https://github.com/elsa-workflows/elsa-core"
              if (project_url != url or repository is None or repository.get("url") != url
                      or repository.get("commit") != source_sha):
                  raise SystemExit(f"Unexpected source URLs: {project_url}, {repository}")
              for framework in frameworks:
                  if f"lib/{framework}/Elsa.Slack.dll" not in package.namelist():
                      raise SystemExit(f"Missing {framework} assembly")
              groups = root.findall("n:metadata/n:dependencies/n:group", namespace)
              if {group.get("targetFramework") for group in groups} != set(frameworks):
                  raise SystemExit(f"Unexpected dependency frameworks: {groups}")
              for group in groups:
                  dependencies = {item.get("id"): item.get("version")
                                  for item in group.findall("n:dependency", namespace)}
                  if dependencies != {"Elsa": elsa_version, "SlackNet": slacknet_version}:
                      raise SystemExit(f"Unexpected package dependencies: {dependencies}")
          with ZipFile(directory / f"{expected}.snupkg") as symbols:
              for framework in frameworks:
                  if f"lib/{framework}/Elsa.Slack.pdb" not in symbols.namelist():
                      raise SystemExit(f"Missing {framework} symbols")
          print(f"Verified artifact-only Elsa.Slack {version} at {directory}")
          PY
      - name: Restore and run a clean package consumer
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          ELSA_VERSION: ${{ steps.dependency.outputs.elsa_version }}
          SLACKNET_VERSION: ${{ steps.dependency.outputs.slacknet_version }}
        run: |
          python3 scripts/integration-program/prove_slack_artifact_consumer.py \
            --artifacts "$RUNNER_TEMP/slack-artifacts" \
            --version "$PACKAGE_VERSION" \
            --elsa-version "$ELSA_VERSION" \
            --slacknet-version "$SLACKNET_VERSION"
      - name: Verify SourceLink against the exact Core commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PACKAGE_VERSION: ${{ steps.dependency.outputs.proof_base_version }}.${{ github.run_id }}.${{ github.run_attempt }}
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/sourcelink" sourcelink \
            --version 3.1.1 --configfile "$RUNNER_TEMP/Slack-NuGet.Config"
          python3 scripts/integration-program/verify_slack_source_link.py \
            --artifacts "$RUNNER_TEMP/slack-artifacts" \
            --version "$PACKAGE_VERSION" \
            --commit "$EXPECTED_SOURCE_SHA" \
            --sourcelink-tool "$RUNNER_TEMP/sourcelink/sourcelink" \
            --output "$RUNNER_TEMP/slack-source-link-receipt.json"
      - name: Defer Core SourceLink verification for fork commits
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo '::notice::Fork commit is not yet in elsa-core; rerun SourceLink verification from the imported repository before release acceptance.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-slack-local-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-artifacts/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: elsa-slack-source-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-source-link-receipt.json
          if-no-files-found: error
          retention-days: 7

  # Individual product release plans
  select:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['product-release-plan'] }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: cells
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PRODUCT: ${{ inputs.product }}
          LINE: ${{ inputs.line }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'scripts/integration-program')
          from plan_product_release import workflow_cells
          print('matrix=' + json.dumps({'include': workflow_cells(dict(os.environ))}))
          PY

  contracts:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['product-release-plan'] }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Test native planner and unchanged source/unit/npm contracts
        env:
          PYTHONPATH: scripts/integration-program
        run: |
          python3 -m unittest test_plan_product_release test_release_unit_manifest test_package_impact test_prepare_maintenance_build test_prove_studio_npm_pair
          python3 -O -m unittest test_plan_product_release test_release_unit_manifest test_package_impact test_prepare_maintenance_build test_prove_studio_npm_pair

  plan:
    needs: [changes, select]
    if: ${{ fromJSON(needs.changes.outputs.suites)['product-release-plan'] }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    name: Plan ${{ matrix.product }} ${{ matrix.line }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Generate SDK metadata and GET-only prerequisite/history observations
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PRODUCT: ${{ matrix.product }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ matrix.version }}
          ELSA_PLAN_GITHUB_TOKEN: ${{ github.repository == 'elsa-workflows/elsa-core' && matrix.product == 'core' && github.token || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/integration-program/plan_product_release.py \
            --product "$PRODUCT" --line "$LINE" --version "$VERSION" \
            --output "$RUNNER_TEMP/product-release-plan"
      - name: Retain only the public planning receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-release-plan-${{ matrix.product }}-${{ matrix.line }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-release-plan/plan.json
          if-no-files-found: error
          retention-days: 14

  # Secrets API and Studio source contract
  pinned-source-contract:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['secrets-contract'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-core
          ref: 7b06b82d0ea89c12d49c3c28da8d770bfca13faf
          path: .contract-sources/core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/Elsa.Secrets/Endpoints/Secrets
            src/modules/Elsa.Secrets/Models
            src/modules/Elsa.Secrets/Features

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-extensions
          ref: 154ba15fb4da85b4bebecfbe43639579cbda1d0d
          path: .contract-sources/extensions
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/secrets

      - name: Fetch legacy Secrets row-schema source pin
        run: git -C .contract-sources/extensions fetch --no-tags --depth=1 origin 01bf9ad70d0399afadae9609fe820703d3de290d

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: elsa-workflows/elsa-studio
          ref: f0eeb3c7428443b09512049fe890635fa4f7b427
          path: .contract-sources/studio
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/modules/Elsa.Studio.Secrets

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compare pinned routes, permissions and DTO contracts
        run: |
          python -m unittest discover -s scripts/integration-program -p 'test_secrets_api_studio_contract.py'
          python -O -m unittest discover -s scripts/integration-program -p 'test_secrets_api_studio_contract.py'
          python scripts/integration-program/verify_secrets_api_studio_contract.py \
            --core .contract-sources/core \
            --extensions .contract-sources/extensions \
            --studio .contract-sources/studio

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'

      - name: Test Core route and permission configuration
        working-directory: scripts/integration-program/secrets-api-studio-contract
        run: |
          dotnet --version
          dotnet test "$GITHUB_WORKSPACE/core/test/unit/Elsa.Secrets.UnitTests/Elsa.Secrets.UnitTests.csproj" \
            --configuration Release --framework net10.0 \
            --filter FullyQualifiedName~SecretsApiContractTests --nologo

      - name: Test HTTP behavior through the pinned Studio Refit client
        working-directory: scripts/integration-program/secrets-api-studio-contract
        run: |
          dotnet test "$GITHUB_WORKSPACE/core/test/integration/Elsa.Secrets.Api.IntegrationTests/Elsa.Secrets.Api.IntegrationTests.csproj" \
            --configuration Release --framework net10.0 --nologo

      - name: Test Secrets route ownership in the default Workbench host
        working-directory: scripts/integration-program/secrets-api-studio-contract
        run: |
          dotnet test "$GITHUB_WORKSPACE/core/test/integration/Elsa.Secrets.DefaultHost.IntegrationTests/Elsa.Secrets.DefaultHost.IntegrationTests.csproj" \
            --configuration Release --framework net10.0 --nologo

  # Studio ClientLib build
  studio-clientlibs:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['studio-clientlibs'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Require the Studio ClientLib source
        run: |
          if ! test -f studio/src/modules/Elsa.Studio.Workflows.Designer/ClientLib/package.json; then
            echo 'Studio is missing the required Designer ClientLib manifest.' >&2
            exit 1
          fi
      - name: Verify browser proof source-binding guards
        working-directory: studio/test/browser/DesignerHover
        run: |
          npm ci
          npm test
      - name: Build Studio ClientLibs
        run: scripts/integration-program/build_studio_clientlibs.sh .
      - name: Verify the bpmn-js designer against the BPMN designer contract
        working-directory: studio/test/browser/BpmnDesigner
        env:
          BPMN_DESIGNER_OUTPUT: ${{ runner.temp }}/bpmn-designer-round-trips
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm test
      - name: Verify Elsa imports the bpmn-js designer's saved documents as it imports the originals
        run: >-
          dotnet run -c Release
          --project studio/test/browser/BpmnDesigner/ImportEquivalence/BpmnImportEquivalence.csproj
          -- "$RUNNER_TEMP/bpmn-designer-round-trips" .
      - name: Verify the X6 designer against the BPMN designer contract
        working-directory: studio/test/browser/BpmnDesigner
        env:
          BPMN_DESIGNER_DIRECTORY: ${{ github.workspace }}/studio/src/modules/Elsa.Studio.Bpmn.X6/wwwroot
          BPMN_DESIGNER_MODULE: x6-designer.js
          BPMN_DESIGNER_STYLESHEET: x6-designer.css
          BPMN_DESIGNER_OUTPUT: ${{ runner.temp }}/bpmn-x6-designer-round-trips
        run: npm test
      - name: Verify Elsa imports the X6 designer's saved documents as it imports the originals
        run: >-
          dotnet run -c Release
          --project studio/test/browser/BpmnDesigner/ImportEquivalence/BpmnImportEquivalence.csproj
          -- "$RUNNER_TEMP/bpmn-x6-designer-round-trips" .
      - name: Verify real X6 edge-hover behavior
        working-directory: studio/test/browser/DesignerHover
        run: |
          npx --no-install playwright install --with-deps chromium
          node run.mjs --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/designer-hover-browser.json"
      - name: Verify source remained unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
      - name: Retain sanitized hover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: designer-hover-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/designer-hover-browser.json
          if-no-files-found: error
          retention-days: 14

  # React Studio source validation
  provenance:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['react-studio'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test rejection of broken import history
        run: python3 -m unittest discover -s scripts/integration-program -p 'test_verify_studio_react_source_import.py' -v
      - name: Verify original donor tree and history
        run: python3 scripts/integration-program/verify_studio_react_source_import.py

  frontend-and-host:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['react-studio'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned pnpm and frozen dependencies
        working-directory: studio/react
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
      - name: Check frontend and build with dependency notices
        working-directory: studio/react
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm localization:check
          pnpm test
          pnpm benchmark:expressions
          pnpm docs:api
          pnpm audit
          pnpm build
      - name: Build the host on all supported frameworks and test runtime configuration
        run: |
          dotnet build Elsa.ReactStudio.slnf
          dotnet test studio/react/dotnet/Elsa.ReactStudio.Host.Tests/Elsa.ReactStudio.Host.Tests.csproj --logger trx --results-directory "$RUNNER_TEMP/react-studio-tests"
      - name: Exercise the ASP.NET host across Chromium, Firefox and WebKit
        working-directory: studio/react
        run: |
          # Regional Ubuntu mirrors can spend most of the job downloading WebKit dependencies.
          sudo sed -i -E \
            -e 's@^URIs: mirror\+file:/etc/apt/apt-mirrors\.txt[[:blank:]]*$@URIs: https://archive.ubuntu.com/ubuntu/@' \
            -e 's@^URIs: https?://([a-z0-9-]+\.)*archive\.ubuntu\.com/ubuntu/?[[:blank:]]*$@URIs: https://archive.ubuntu.com/ubuntu/@' \
            /etc/apt/sources.list.d/ubuntu.sources
          grep -Fx 'URIs: https://archive.ubuntu.com/ubuntu/' /etc/apt/sources.list.d/ubuntu.sources
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:browser
      - name: Pack the Preview feature libraries without publishing
        run: |
          python3 studio/react/scripts/test-release-selection.py
          python3 studio/react/scripts/test-package-version-policy.py
          dotnet pack Elsa.ReactStudio.slnf -c Release \
            --output "$RUNNER_TEMP/react-studio-packages" -p:Version=3.11.0-preview.${{ github.run_id }}
          python3 studio/react/scripts/verify-nuget-packages.py \
            "$RUNNER_TEMP/react-studio-packages" 3.11.0-preview.${{ github.run_id }}
      - name: Prepare and install the lockstep npm release artifacts
        working-directory: studio/react
        run: |
          node scripts/prepare-npm-release.mjs 3.11.0-preview.${{ github.run_id }} "$RUNNER_TEMP/react-studio-npm"
          node scripts/test-npm-release.mjs "$RUNNER_TEMP/react-studio-npm"
          pnpm test:packages --npm-feed "$RUNNER_TEMP/react-studio-npm"
      - name: Generate and verify an independently packaged third-party module
        working-directory: studio/react
        run: pnpm test:module --nuget-feed "$RUNNER_TEMP/react-studio-packages" --studio-version 3.11.0-preview.${{ github.run_id }} --npm-feed "$RUNNER_TEMP/react-studio-npm"
      - name: Build and start the standalone Preview image without publishing
        run: |
          docker build -f studio/react/Dockerfile -t elsa-react-studio:ci .
          test "$(docker inspect elsa-react-studio:ci --format '{{.Config.User}}')" != '0'
          test -n "$(docker inspect elsa-react-studio:ci --format '{{.Config.User}}')"
          docker run -d --name react-studio-preview -p 127.0.0.1:5202:8080 \
            -e STUDIO_SERVER_URL=http://127.0.0.1:5001/elsa/api \
            -e STUDIO_TITLE='Container Preview' -e STUDIO_AUTH_PROVIDER=none elsa-react-studio:ci
          trap 'docker logs react-studio-preview; docker rm -f react-studio-preview' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:5202/studio-preview/studio-config > "$RUNNER_TEMP/container-config.json"
          python3 - <<'PY'
          import json, re, urllib.request
          config = json.load(open(__import__('os').environ['RUNNER_TEMP'] + '/container-config.json'))
          assert config['title'] == 'Container Preview' and config['auth']['provider'] == 'none'
          origin = 'http://127.0.0.1:5202'
          html = urllib.request.urlopen(origin + '/studio-preview/workflows/definitions').read().decode()
          assert '<base href="/studio-preview/"' in html
          asset = re.search(r'src="([^"]+\.js)"', html).group(1)
          response = urllib.request.urlopen(origin + asset)
          assert response.status == 200 and len(response.read()) > 1000
          assert urllib.request.urlopen(origin + '/studio-preview/THIRD-PARTY-NOTICES.txt').status == 200
          PY
      - name: Verify the paired reference server and Preview containers
        env:
          ELSA_SERVER_PORT: '5203'
          ELSA_STUDIO_PORT: '5204'
          ELSA_REACT_STUDIO_IMAGE: elsa-react-studio:ci
        run: |
          set -euo pipefail
          docker build -f docker/ElsaServer.Dockerfile -t elsa-server:react-preview .
          docker compose -p react-studio-ci -f studio/react/compose.yaml up --no-build -d
          trap 'docker compose -p react-studio-ci -f studio/react/compose.yaml logs; docker compose -p react-studio-ci -f studio/react/compose.yaml down -v' EXIT
          (cd studio/react && node scripts/test-container-pair.mjs)
      - name: Verify source remained unchanged
        run: git diff --exit-code HEAD --
      - name: Retain validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-studio-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/react-studio-tests/*.trx
            studio/react/test-results/**
            studio/react/docs/api/**
            ${{ runner.temp }}/react-studio-packages/*.nupkg
            ${{ runner.temp }}/react-studio-npm/*
          if-no-files-found: warn
          retention-days: 14

  # Apps source validation
  projects:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['apps'] }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.head_ref || github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.release_version }}
      core: ${{ steps.plan.outputs.core_version }}
      studio: ${{ steps.plan.outputs.studio_version }}
      extensions: ${{ steps.plan.outputs.extensions_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Verify original source and effective project boundaries
        run: |
          python3 -m unittest discover -s scripts/integration-program -p 'test_verify_apps_source_import.py' -v
          dotnet msbuild Elsa.Apps.slnf -t:GenerateRestoreGraphFile \
            -p:RestoreGraphOutputPath="$RUNNER_TEMP/apps-root-restore-graph.json" -nologo -v:quiet
          python3 scripts/integration-program/verify_apps_source_import.py --evaluate \
            --restore-graph "$RUNNER_TEMP/apps-root-restore-graph.json"
      - name: Verify solution grouping
        run: |
          python3 -m unittest discover -s scripts/solution -p 'test_*.py'
          python3 scripts/solution/solution_groups.py --check
      - name: Test existing container policy and local provenance
        working-directory: apps
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Plan fixed nonpublishing profile validation
        id: plan
        working-directory: apps
        run: |
          python3 scripts/container_release.py validate-run \
            --event pull_request --publish false --images all \
            --ref "$SOURCE_REF" --commit "$EXPECTED_HEAD"
      - name: Restore and build all current package consumers
        run: |
          dotnet restore Elsa.Apps.slnf --force-evaluate
          dotnet restore apps/ElsaApps.sln
          dotnet build apps/ElsaApps.sln -c Release --no-restore
          dotnet build Elsa.Apps.slnf -c Release --no-restore
      - name: Verify source remained unchanged
        run: git diff --exit-code HEAD --

  images:
    needs: [changes, projects]
    if: ${{ fromJSON(needs.changes.outputs.suites)['apps'] }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.head_ref || github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Build a local AMD64 image without publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: apps
          file: apps/${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: elsa-source-${{ matrix.id }}:${{ env.EXPECTED_HEAD }}
          labels: |
            org.opencontainers.image.source=https://github.com/elsa-workflows/elsa-core
            org.opencontainers.image.revision=${{ env.EXPECTED_HEAD }}
            org.opencontainers.image.version=${{ needs.projects.outputs.version }}
            org.opencontainers.image.ref.name=${{ env.SOURCE_REF }}
            com.elsa.packages.core=${{ needs.projects.outputs.core }}
            com.elsa.packages.studio=${{ needs.projects.outputs.studio }}
            com.elsa.packages.extensions=${{ needs.projects.outputs.extensions }}
          build-args: |
            ElsaVersion=${{ needs.projects.outputs.core }}
            ElsaStudioVersion=${{ needs.projects.outputs.studio }}
            ElsaExtensionsVersion=${{ needs.projects.outputs.extensions }}
      - name: Verify package provenance, assets and application smoke
        working-directory: apps
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_PORT: ${{ matrix.port }}
          VERSION: ${{ needs.projects.outputs.version }}
          CORE_VERSION: ${{ needs.projects.outputs.core }}
          STUDIO_VERSION: ${{ needs.projects.outputs.studio }}
          EXTENSIONS_VERSION: ${{ needs.projects.outputs.extensions }}
        run: |
          python3 scripts/container_release.py verify-local \
            --id "$IMAGE_ID" --repository "$IMAGE_REPOSITORY" \
            --reference "elsa-source-$IMAGE_ID:$EXPECTED_HEAD" \
            --version "$VERSION" --commit "$EXPECTED_HEAD" --source-ref "$SOURCE_REF" \
            --source-repository elsa-workflows/elsa-core \
            --core-version "$CORE_VERSION" --studio-version "$STUDIO_VERSION" \
            --extensions-version "$EXTENSIONS_VERSION" --port "$IMAGE_PORT" \
            --output-file "$RUNNER_TEMP/apps-smoke-$IMAGE_ID.json"
      - name: Retain only structured nonpublishing smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-source-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apps-smoke-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  # Templates source validation
  templates:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['templates'] }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.300'
      - name: Verify original source and independent project boundaries
        run: |
          dotnet msbuild Elsa.Templates.slnf -t:GenerateRestoreGraphFile \
            -p:RestoreGraphOutputPath="$RUNNER_TEMP/templates-restore-graph.json" -nologo -v:quiet
          python3 scripts/integration-program/verify_templates_source_import.py --evaluate \
            --restore-graph "$RUNNER_TEMP/templates-restore-graph.json"
      - name: Verify retained publisher metadata guards without publishing
        run: python3 -m unittest discover -s templates/test -p 'validate_packages_workflow.py' -v
      - name: Restore and build the independent product and root filter
        run: |
          dotnet restore Elsa.Templates.slnf --force-evaluate
          dotnet restore templates/Elsa.Templates.slnx
          dotnet build templates/Elsa.Templates.slnx -c Release --no-restore
          dotnet build Elsa.Templates.slnf -c Release --no-restore
      - name: Pack, install and build the 20 supported starter cases
        run: |
          dotnet test templates/test/Elsa.Templates.Tests/Elsa.Templates.Tests.csproj \
            -c Release --no-build --logger trx --results-directory "$RUNNER_TEMP/templates-results"
      - name: Verify all existing smoke cases ran and passed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = list((Path(os.environ['RUNNER_TEMP']) / 'templates-results').glob('*.trx'))
          if len(results) != 1:
              raise SystemExit('Expected one Templates smoke-test receipt')
          counters = ET.parse(results[0]).find('.//{*}Counters')
          if counters is None or any(counters.get(key) != '20' for key in ('total', 'executed', 'passed')) or counters.get('failed') != '0':
              raise SystemExit('All 20 supported template smoke cases must execute and pass')
          PY
      - name: Verify tracked source remained unchanged
        run: git diff --exit-code HEAD --
      - name: Retain nonpublishing test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: templates-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/templates-results/*.trx
            ${{ runner.temp }}/templates-restore-graph.json
          if-no-files-found: warn
          retention-days: 14

  # Persisted workflow compatibility with published packages
  persisted-upgrade:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.suites)['persisted-upgrade'] }}
    name: Persisted workflow upgrade (${{ matrix.baseline }}, ${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: ['3.8.4', '3.9.0']
        framework: ['net8.0', 'net9.0', 'net10.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Verify released packages can resume persisted workflows
        env:
          CELL: ${{ matrix.baseline }}/${{ matrix.framework }}
        run: >-
          python3 scripts/integration-program/run_persisted_workflow_upgrade_fixture.py
          --released-target --cell "$CELL" --output "$RUNNER_TEMP/persisted-upgrade"
      - name: Retain synthetic compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persisted-upgrade-${{ matrix.baseline }}-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persisted-upgrade/retained-evidence
          if-no-files-found: warn
          retention-days: 7

  # One check that always reports, whichever jobs above were skipped. Add new jobs to its needs.
  result:
    name: PR checks result
    if: ${{ always() }}
    needs:
      - changes
      - affected
      - ubuntu-latest
      - check-toc
      - check
      - build-product-filters
      - validate-gates
      - smoke
      - admission-proof
      - execution-cycle-proof
      - store-tests
      - mongo-atomic-proof
      - retained-testing-helper
      - import-rehearsal-tests
      - select-tests
      - run-affected-tests
      - selector-and-plan
      - pinned-source-tests
      - released-artifact-proof
      - mapped-source-artifact-proof
      - prove
      - pack-studio-core
      - pack-slack-only
      - select
      - contracts
      - plan
      - pinned-source-contract
      - studio-clientlibs
      - provenance
      - frontend-and-host
      - projects
      - images
      - templates
      - persisted-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
