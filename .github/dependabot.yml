# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
registries:
  elsa-feedz-preview:
    type: nuget-feed
    url: https://f.feedz.io/elsa-workflows/elsa-3/nuget/index.json
    token: ${{secrets.FEEDZ_API_KEY}}
  # Public feed; the root NuGet.Config maps the Loom packages to it.
  valence-loom-feedz:
    type: nuget-feed
    url: https://f.feedz.io/valence-works/loom/nuget/index.json

updates:
  # React Studio has an independent pnpm lockfile; keep it in its own bounded job.
  - package-ecosystem: "npm"
    directory: "/studio/react"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
      include: "scope"
  # Five bounded starting sets; shared imports/references can still overlap.
  # Limit 1 applies per entry (up to five version-update PRs), not repository-wide.
  # Core production
  - package-ecosystem: "nuget"
    directories:
      - "/core/src/**/*"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Core tests (Elsa-named parents; TlsSmoke stays outside the solution)
  - package-ecosystem: "nuget"
    directories:
      - "/core/test/**/Elsa.*"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Extensions, including tests, samples and the retained testing project
  - package-ecosystem: "nuget"
    directories:
      - "/extensions/**/*"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Studio, including samples
  - package-ecosystem: "nuget"
    directories:
      - "/studio/**/*"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "15:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Shared build and explicit root tool manifest coverage
  - package-ecosystem: "nuget"
    directories:
      - "/build"
      - "/.config"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "18:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
