# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
registries:
  elsa-feedz-preview:
    type: nuget-feed
    url: https://f.feedz.io/elsa-workflows/elsa-3/nuget/index.json
    token: ${{secrets.FEEDZ_API_KEY}}
  # Public feed; the root NuGet.Config maps the Loom packages to it.
  valence-loom-feedz:
    type: nuget-feed
    url: https://f.feedz.io/valence-works/loom/nuget/index.json

updates:
  # One solution scan coordinates Core, Extensions, Studio and shared build updates.
  # Keep the retained non-solution testing project visible until its disposition is reviewed.
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/extensions/src/Elsa.Testing.Extensions"
    target-branch: "main"
    registries:
      - elsa-feedz-preview
      - valence-loom-feedz
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 1
    groups:
      elsa-core-preview:
        patterns:
          - "Elsa*"
    commit-message:
      prefix: "deps"
      include: "scope"
