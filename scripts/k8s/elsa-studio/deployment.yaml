apiVersion: apps/v1
kind: Deployment
metadata:
  name: elsa-studio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elsa-studio
  template:
    metadata:
      labels:
        app: elsa-studio
    spec:
      containers:
        - name: elsa-studio
          imagePullPolicy: Never
          image: elsa-studio:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: Backend__Url
              value: "http://elsa-server-service:8001/elsa/api"